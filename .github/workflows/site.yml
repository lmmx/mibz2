name: Documentation site

# Builds the site (docs/site/, zensical.toml, the API reference from python/mibz2/) and
# publishes it to GitHub Pages from the gh-pages branch.
#
# Production (pushes to master) goes to the root of gh-pages, served at
# https://lmmx.github.io/mibz2/. Each pull request from this repository that touches the site
# or the package's source gets a preview under gh-pages/pr-preview/pr-<number>/, linked from
# a comment on the pull request, updated on every push and removed when it closes.
# Production deploys leave pr-preview/ alone, and previews touch only their own directory.
#
# Previews are deployed only once Pages serves the gh-pages branch (the pages job reads the
# Pages build type: "legacy" is a branch source). Until then only production is pushed to
# gh-pages, which creates the branch for the owner to select as the Pages source.
#
# Adapted from lmmx/pq-glue's site.yml (itself lmmx/wend's), with wikidata-pq's benchmark
# history: the benchmark pages read data that the build makes from the bench-results branch
# (docs/scripts/bench_history.py: master's records only). The Benchmark workflow pushes
# master's records there as its runs finish, after the push's own build, so each Benchmark
# run on master builds and deploys the site again (workflow_run).

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, reopened, synchronize, closed]
    paths:
      - ".github/workflows/site.yml"
      - "bench/report.py"
      - "docs/conftest.py"
      - "docs/scripts/**"
      - "docs/site/**"
      - "python/**"
      - "src/**"
      - "zensical.toml"
  workflow_run:
    workflows: [Benchmark]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The docs toolchain, pinned. mkdocstrings-python formats signatures with ruff.
  DOCS_WITH: >-
    --with zensical==0.0.71
    --with mkdocstrings-python==2.0.9
    --with ruff==0.17.1
  PAGES_URL: https://lmmx.github.io/mibz2/

jobs:
  # "legacy" once Pages serves a branch; "unknown" while Pages is not enabled.
  pages:
    runs-on: ubuntu-latest
    permissions:
      pages: read
    outputs:
      build_type: ${{ steps.pages.outputs.build_type }}
    steps:
      - id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || true)
          case "${build_type}" in
            legacy | workflow) ;;
            *) build_type=unknown ;;
          esac
          echo "Pages build type: ${build_type}"
          echo "build_type=${build_type}" >> "$GITHUB_OUTPUT"

  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      # Master's history for the benchmark history's commits (their order, dates and
      # subjects): every commit, no file contents but the checkout's
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: blob:none
      # The benchmark's records (data only): none yet before master's first Benchmark run
      - name: Benchmark history
        run: |
          git fetch -q origin bench-results:refs/remotes/origin/bench-results || echo "no bench-results branch yet"
          python3 docs/scripts/bench_history.py
      - uses: astral-sh/setup-uv@v8.1.0
      - name: Point the site at its preview path
        if: github.event_name == 'pull_request'
        env:
          PREVIEW_URL: ${{ env.PAGES_URL }}pr-preview/pr-${{ github.event.pull_request.number }}/
        run: sed -i "s|^site_url = .*|site_url = \"${PREVIEW_URL}\"|" zensical.toml
      # --strict fails on broken links, anchors and cross-references; griffe's docstring
      # warnings do not count as issues for Zensical, so the log is checked for them.
      - name: Build
        run: |
          set -o pipefail
          uv run --no-project -p 3.13 ${DOCS_WITH} zensical build --clean --strict 2>&1 | tee build.log
          if grep -q '^griffe:' build.log; then
            echo "::error::griffe reported docstring problems (lines starting 'griffe:' above)"
            exit 1
          fi
      - name: Check the nav, internal links, llms.txt and API coverage
        run: uv run --no-project -p 3.13 python docs/scripts/check_site.py
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the examples in the pages
        run: uv run -p 3.13 --group test pytest docs/site
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site
          retention-days: 7

  # Production, on the gh-pages branch (created by the first run).
  deploy-branch:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-production
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      # Serve the files as built, without Jekyll.
      - run: touch site/.nojekyll
      - uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          branch: gh-pages
          folder: site
          clean: true
          clean-exclude: pr-preview/
          force: false
          commit-message: Deploy the documentation site from ${{ github.sha }}

  # Pull request previews. Only for pull requests from this repository: a fork's workflow
  # has a read-only token, and this job runs none of the pull request's code, only the
  # built files from the build job.
  preview:
    if: >-
      !cancelled()
      && github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.pages.outputs.build_type == 'legacy'
      && (needs.build.result == 'success' || github.event.action == 'closed')
    needs: [pages, build]
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      pages: read
      pull-requests: write
    steps:
      # The deploy step needs a checkout to work in; the default branch, not the pull request.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - if: github.event.action != 'closed'
        uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: rossjrw/pr-preview-action@v1.8.1
        with:
          source-dir: site
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          qr-code: "false"
          wait-for-pages-deployment: true

# The walk's mechanisms taken apart on the Wikidata blocks, on one runner
# (examples/sweep.rs): the lane count (the interleaved chains), the prefetch (none, L1, L2,
# non-temporal) and the scheduling (the room walk against the flagged walk), each against the
# settings Segmented uses, paired by round; alone on one CPU, then with a copy on every CPU;
# with hardware counters where the runner exposes them. A diagnostic for choosing settings to try, from the Actions tab only: its
# figures are the run's summary and artifact, never recorded, and a setting it favours is
# decided by the decoder's own A/B (bench.yml) on a pull request. With `tool: phases`, the
# stage table's examples/phases.rs runs the same way instead (ROUNDS its passes): the
# stages alone and with every CPU busy, as a multi-threaded decode runs them. With
# `tool: pair`, examples/pair.rs runs once, pinning its own threads (ROUNDS rounds, at
# least 7; a reading uses 9): the walk, MTF and the build each measured on one CPU beside
# a chosen load (another walk, a one-line chain, ALU loops, MTF, the build, streaming
# reads, a whole decode, and for the walk a PAUSE spin, an L1 store stream, 32-lane
# chases and the same block walked together) on its SMT sibling and on the other core,
# with the other core idle or busy, and alone; plus fixed work for both siblings; its
# markdown is the summary, its JSON (pair.json) and the runner's records
# (pair-topology.txt) in the artifact. Registered in docs/journal/2026-11-05-pair-matrix.md.
# Never part of bench.yml or a pull request's benchmark.
name: Walk sweep

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds (each walks every block at every setting); for phases, its passes; for pair, at least 7 (9 for a reading)"
        required: false
        default: "5"
      tool:
        description: "sweep (the factorial), phases (the stages) or pair (a stage beside a chosen sibling load)"
        required: false
        default: "sweep"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # The runner's CPU model first, seconds in, so a run on a model already covered can be
      # cancelled before the build (also a notice on the run's page)
      - name: Runner
        run: |
          model=$(awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo | sed 's/^ //')
          echo "runner: $model, $(nproc) CPUs"
          echo "::notice title=runner::$model, $(nproc) CPUs"

      # lbzip2: examples/windows.rs's check of the Wikidata blocks
      - name: lbzip2
        run: sudo apt-get install -y -qq lbzip2 > /dev/null

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # the tool's example only, and windows (the corpus's check)
      - name: Build
        env:
          TOOL: ${{ inputs.tool || 'sweep' }}
        run: |
          case "$TOOL" in sweep|phases|pair) ;; *) echo "tool: sweep, phases or pair"; exit 1 ;; esac
          cargo build --release --example "$TOOL" --example windows

      # The same blocks as bench.yml's (bench/wikidata.json), from its cache or bench-data
      - name: Wikidata windows (cache)
        uses: actions/cache@v4
        with:
          path: windows
          key: bench-wikidata-${{ hashFiles('bench/wikidata.json') }}

      - name: Wikidata windows
        run: |
          mkdir -p corpora
          dir=$(python3 -c 'import json; print(json.load(open("bench/wikidata.json"))["windows_dir"])')
          if [ "$(ls "$dir"/*.bin 2>/dev/null | wc -l)" = 0 ] && git fetch -q origin bench-data:refs/remotes/origin/bench-data 2>/dev/null; then
            git archive origin/bench-data "$dir" | tar -x || true
          fi
          python3 bench/wikidata.py fetch bench/wikidata.json "$dir"
          python3 bench/wikidata.py build bench/wikidata.json "$dir" target/release/examples/windows corpora/wikidata.bz2

      # Counters where the runner exposes a PMU: let this process count its own events
      - name: Counters
        run: sudo sysctl -w kernel.perf_event_paranoid=1 || true

      # One copy pinned to one CPU, then a copy on each CPU at once: a setting that wins
      # alone can lose when four walks share the caches and the memory system
      - name: Sweep
        if: (inputs.tool || 'sweep') != 'pair'
        env:
          ROUNDS: ${{ inputs.rounds }}
          TOOL: ${{ inputs.tool || 'sweep' }}
        run: |
          mhz=$(awk -F: '/cpu MHz/ {print $2; exit}' /proc/cpuinfo | tr -d ' ')
          model=$(awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo | sed 's/^ //')
          ghz=$(python3 -c "print(round($mhz / 1000, 4))")
          case "$TOOL" in sweep|phases) ;; *) echo "tool: sweep or phases"; exit 1 ;; esac
          bin=target/release/examples/$TOOL
          start=$SECONDS
          # each file names its runner: runners differ in CPU model, and so in the figures
          { echo "runner: $model, $(nproc) CPUs, ${ghz} GHz reported; $(rustc --version); head $(git rev-parse --short HEAD); $TOOL, rounds $ROUNDS"; taskset -c 1 $bin corpora/wikidata.bz2 "$ROUNDS" "$ghz"; } | tee sweep-1.txt
          alone=$((SECONDS - start)); start=$SECONDS
          cpus=$(nproc)
          for c in $(seq 0 $((cpus - 1))); do
            { echo "runner: $model, $cpus CPUs, ${ghz} GHz reported; $(rustc --version); head $(git rev-parse --short HEAD); $TOOL, rounds $ROUNDS; this copy on CPU $c"; taskset -c "$c" $bin corpora/wikidata.bz2 "$ROUNDS" "$ghz"; } > "sweep-$cpus-cpu$c.txt" &
          done
          wait
          together=$((SECONDS - start))
          {
            echo "## Walk sweep ($TOOL): $model, $cpus cores, at its reported clock (${ghz} GHz)"
            echo
            echo "Head \`$(git rev-parse --short HEAD)\`, $(rustc --version). Diagnostic only: the decoder's A/B decides."
            echo
            echo "### One copy, pinned to one CPU (${alone} s)"
            echo
            echo '```'
            cat sweep-1.txt
            echo '```'
            echo
            echo "### $cpus copies at once, one a CPU (${together} s): the copy on CPU 0 (the others are in the artifact)"
            echo
            echo '```'
            cat "sweep-$cpus-cpu0.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The pair matrix: one process on the whole runner, its threads pinned by itself (the
      # measured stage on one CPU, its load on the SMT sibling or on the other core), so no
      # taskset; it says so, and runs the cross-core conditions only, where there is no SMT.
      # pair-topology.txt records the runner: its cores, each cache's sharing (whether the
      # two cores share an L3), the guest's idle path, its boot line and hugepages; the
      # binary reads the CPU model and GITHUB_RUN_ID into pair.json itself
      - name: Pair
        if: inputs.tool == 'pair'
        env:
          ROUNDS: ${{ inputs.rounds }}
        run: |
          case "$ROUNDS" in ''|*[!0-9]*) echo "::error::rounds: a number"; exit 1 ;; esac
          [ "$ROUNDS" -ge 7 ] || { echo "::error::pair: at least 7 rounds (9 for a reading)"; exit 1; }
          mhz=$(awk -F: '/cpu MHz/ {print $2; exit}' /proc/cpuinfo | tr -d ' ')
          model=$(awk -F: '/model name/ {print $2; exit}' /proc/cpuinfo | sed 's/^ //')
          ghz=$(python3 -c "print(round($mhz / 1000, 4))")
          head="runner: $model, $(nproc) CPUs, ${ghz} GHz reported; $(rustc --version); head $(git rev-parse --short HEAD); pair, rounds $ROUNDS; run $GITHUB_RUN_ID"
          echo "$head"
          sys=/sys/devices/system/cpu
          rd() { cat "$1" 2>/dev/null || echo unreadable; }
          {
            for c in $sys/cpu[0-9]*; do
              echo "$(basename "$c"): siblings $(rd "$c/topology/thread_siblings_list"), core_id $(rd "$c/topology/core_id")"
            done | sort -V
            for c in $sys/cpu[0-9]*; do
              for i in "$c"/cache/index*; do
                echo "$(basename "$c") $(basename "$i"): L$(rd "$i/level") $(rd "$i/type") $(rd "$i/size"), shared_cpu_list $(rd "$i/shared_cpu_list")"
              done
            done | sort -V
            echo "cpuidle current_driver: $(rd $sys/cpuidle/current_driver)"
            echo "cpuidle current_governor: $(cat $sys/cpuidle/current_governor 2>/dev/null || rd $sys/cpuidle/current_governor_ro)"
            echo "transparent_hugepage enabled: $(rd /sys/kernel/mm/transparent_hugepage/enabled)"
            echo "transparent_hugepage defrag: $(rd /sys/kernel/mm/transparent_hugepage/defrag)"
            echo "kernel: $(uname -r)"
            echo "cmdline: $(rd /proc/cmdline)"
            echo "lscpu -C:"
            lscpu -C 2>&1 || true
          } > pair-topology.txt
          cat pair-topology.txt
          start=$SECONDS
          target/release/examples/pair corpora/wikidata.bz2 "$ROUNDS" "$ghz" --json pair.json > pair.md
          took=$((SECONDS - start))
          cat pair.md
          {
            echo "## Pair matrix: $model, $(nproc) CPUs, at its reported clock (${ghz} GHz)"
            echo
            echo "Head \`$(git rev-parse --short HEAD)\`, $(rustc --version), ${took} s. Diagnostic only: the decoder's A/B decides."
            echo
            echo '```'
            echo "$head"
            cat pair-topology.txt
            echo '```'
            echo
            # its headings one level down, under this one
            sed 's/^#/##/' pair.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Results
        if: "!cancelled()"
        uses: actions/upload-artifact@v4
        with:
          name: sweep-${{ github.sha }}
          path: |
            sweep-*.txt
            pair.md
            pair.json
            pair-topology.txt
          if-no-files-found: ignore

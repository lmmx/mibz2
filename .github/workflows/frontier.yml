# The frontier's optional mirror and courtesy check. Nothing depends on this workflow: STATUS.md is
# generated locally with `python3 frontier/tools/frontier.py status` (it is gitignored, so parallel
# PRs never conflict on it), and every agent runs `frontier.py check` itself. This only publishes
# the page to issue #943 and the Needs Louis list to #944, so they can be read without a checkout,
# and runs the check on every PR.
name: frontier

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review, converted_to_draft]
  # Only the base branch's trusted code runs on these events, never the PR head.
  pull_request_target:
    branches: [master]
    types: [opened, reopened, synchronize, edited, closed, ready_for_review, converted_to_draft]
  push:
    branches: [master]
    paths: ["frontier/**"]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin +refs/heads/master:refs/remotes/origin/master
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: python3 frontier/tools/frontier.py check --pr-event "$GITHUB_EVENT_PATH"
      - name: Frontier regression tests when the mechanism changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if ! git diff --quiet "$BASE_SHA" HEAD -- frontier/tools/ tests/test_frontier.py .github/workflows/frontier.yml; then
            python3 tests/test_frontier.py
          fi
          if ! git diff --quiet "$BASE_SHA" HEAD -- frontier/tools/ tests/test_continuation.py .github/workflows/frontier.yml; then
            python3 tests/test_continuation.py
          fi

  mirror:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write
    concurrency:
      group: frontier-status-mirror
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Mirror STATUS.md and Needs Louis to their issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 frontier/tools/frontier.py status
          status=$(python3 -c "import tomllib;print(tomllib.load(open('frontier/config.toml','rb'))['status_issue'])")
          louis=$(python3 -c "import tomllib;print(tomllib.load(open('frontier/config.toml','rb'))['needs_louis_issue'])")
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${status}" -F body=@frontier/STATUS.md >/dev/null
          awk '/^## Needs Louis/{f=1} /^## Open flags/{f=0} f' frontier/STATUS.md > needs.md
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/${louis}" -F body=@needs.md >/dev/null

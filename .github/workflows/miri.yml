name: Miri

# The segmented walks' unsafe code under Miri, on blocks small enough to interpret
# (bwt::tests::miri_*, about a minute). Each test asserts it reached the walk's handoff
# transitions, so a pass means they were checked. And the cooperative pool's
# (coop::tests::miri_*): its lifetime erasure, panics and wake-ups, under Miri's race
# detector. And the pipelined worker's recovery from a run that panics outside its stages
# (parallel::unwind_tests::miri_*, Guardian D047): the unwind through the pool, the held
# blocks' retirement, the team's reset and the reader, on tiny blocks. And the service
# core's hub (parallel::service_tests::miri_*, D045/D053/D057's fixtures) and its team run
# (coop::tests::miri_team_run_and_its_panic), and its outer unwind's guard-and-fail
# (parallel::service_unwind_tests::miri_outer_*, Guardian D067). Only on changes to
# the walks, the pool, the parallel decoder or its reader.
on:
  pull_request:
    paths:
      - "src/bwt.rs"
      - "src/cells.rs"
      - "src/cells_lazy.rs"
      - "src/cells_lazy_test.rs"
      - "src/cells_lever.rs"
      - "src/cells_owned.rs"
      - "src/cells_owned_test.rs"
      - "src/cells_selective_test.rs"
      - "src/coop.rs"
      - "src/parallel.rs"
      - "src/parallel/**"
      - "src/read.rs"
      - "src/runs.rs"
      - "src/runs/**"
      - ".github/workflows/miri.yml"
  push:
    branches: [main, master]
    paths:
      - "src/bwt.rs"
      - "src/cells.rs"
      - "src/cells_lazy.rs"
      - "src/cells_lazy_test.rs"
      - "src/cells_lever.rs"
      - "src/cells_owned.rs"
      - "src/cells_owned_test.rs"
      - "src/cells_selective_test.rs"
      - "src/coop.rs"
      - "src/parallel.rs"
      - "src/parallel/**"
      - "src/read.rs"
      - "src/runs.rs"
      - "src/runs/**"
      - ".github/workflows/miri.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  miri:
    runs-on: ubuntu-latest
    # Miri is nightly's: rust-toolchain.toml's pin would otherwise win over the default the
    # action sets, so every step here names nightly
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly # not the pin: Miri needs nightly (RUSTUP_TOOLCHAIN above)
        with:
          components: miri, rust-src
      - uses: Swatinem/rust-cache@v2
      - name: Miri setup
        run: cargo miri setup
      # (`--lib -- miri_` reaches only the library's unit tests named miri_: the worker's
      # recovery tests are among them, which this step checks, so that a rename can't drop
      # them silently; tests/pipelined.rs's integration tests stay native)
      - name: The worker recovery tests are selected
        run: |
          cargo miri test --lib -- miri_ --list 2>/dev/null | tee miri-list.txt
          grep -q '^read::tests::miri_sequential_default_cells_route:' miri-list.txt
          grep -q '^cells::tests::miri_cells_exact_fit_and_reuse' miri-list.txt
          grep -q '^cells::tests::miri_cells_admission_and_invalid_records' miri-list.txt
          grep -q '^cells::tests::miri_cells_slots_mark_and_links' miri-list.txt
          grep -q '^cells::tests::miri_cells_long_writer:' miri-list.txt
          grep -q '^cells::tests::miri_cells_selective_boundaries_reuse:' miri-list.txt
          grep -q '^cells::tests::miri_cells_long_writer_production_admission:' miri-list.txt
          grep -q '^cells::tests::miri_cells_owned_writer:' miri-list.txt
          grep -q '^cells::tests::miri_cells_promised_slots_exact_fit:' miri-list.txt
          grep -q '^cells::tests::miri_cells_bottom_slots_read_through_top:' miri-list.txt
          grep -q '^cells::tests::miri_cells_dead_regions:' miri-list.txt
          grep -q '^cells::tests::miri_cells_lever_boundaries_reuse:' miri-list.txt
          grep -q '^cells::tests::miri_cells_lever_exact_fit_and_reuse:' miri-list.txt
          grep -q '^cells::tests::miri_cells_lazy_closed_letters_give_their_slots_back:' miri-list.txt
          grep -q '^parallel::unwind_tests::miri_run_panic' miri-list.txt
          grep -q '^parallel::service_tests::miri_every_retirement_returns_its_buffers' miri-list.txt
          grep -q '^parallel::service_tests::miri_a_parked_service_worker_wakes_on_the_pop' miri-list.txt
          grep -q '^coop::tests::miri_team_run_and_its_panic' miri-list.txt
          grep -q '^parallel::service_unwind_tests::miri_outer_parked' miri-list.txt
          grep -q '^open::b5::miri_open_kernel_small_columns:' miri-list.txt
      - name: Miri
        run: cargo miri test --lib -- miri_
      # the memory-lever experiment's staged Cells kernel (`memory-lever`, research): its
      # unsafe regions against the original induction, and the store fence's model (the
      # lazy kernel's tests ran above, without the feature)
      - name: The memory-lever kernels' tests are selected
        run: |
          cargo miri test --features memory-lever --lib -- miri_cells_lever miri_cells_staged miri_cells_lazy --list 2>/dev/null | tee lever-list.txt
          grep -q '^cells::tests::miri_cells_lever_boundaries_reuse:' lever-list.txt
          grep -q '^cells::tests::miri_cells_lever_exact_fit_and_reuse:' lever-list.txt
          grep -q '^cells::tests::miri_cells_staged_fence_covers_every_exit:' lever-list.txt
          grep -q '^cells::tests::miri_cells_lazy_closed_letters_give_their_slots_back:' lever-list.txt
      - name: Miri, the memory-lever kernels
        run: cargo miri test --features memory-lever --lib -- miri_cells_lever miri_cells_staged miri_cells_lazy

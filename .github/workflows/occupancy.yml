name: Occupancy

# The occupancy instrument (#39, examples/occupancy.rs): where the parallel decoder's time
# goes at each thread count, on the benchmark's Wikidata corpus. It runs `just
# bench-occupancy`, the same command as on any other machine, and keeps its result file.
# From the Actions tab, and on a pull request that changes the instrument itself.
# Diagnostic only: the benchmark's paired A/B decides what is faster.

on:
  workflow_dispatch:
    inputs:
      rounds:
        description: "Rounds (each runs every thread count in all three modes)"
        required: false
        default: "6"
      threads:
        description: "Thread counts, e.g. 1,2,4 (default: 1, 2, 4, ... up to the CPUs)"
        required: false
        default: ""
      args:
        description: "More arguments for the instrument, e.g. --placements packed/spread"
        required: false
        default: ""
  pull_request:
    paths:
      - src/trace.rs
      - docs/ledger.md
      - examples/occupancy.rs
      - bench/occupancy.sh
      - .just/bench.just
      - .github/workflows/occupancy.yml

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never

jobs:
  occupancy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # lbzip2: examples/windows.rs's check of the Wikidata blocks
      - name: lbzip2
        run: sudo apt-get install -y -qq lbzip2 > /dev/null

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@64adfd9e935fa438859b9e080fd026720b2ba070 # tag=just
        with:
          tool: just@1.38.0

      # The same blocks as bench.yml's (bench/wikidata.json); bench/occupancy.sh reads them
      # from here, else the bench-data branch, else the dump
      - name: Wikidata windows (cache)
        uses: actions/cache@v4
        with:
          path: windows
          key: bench-wikidata-${{ hashFiles('bench/wikidata.json') }}

      # The instrument's own tests: the footprint ledger against the buffers' capacities
      # (src/trace.rs), and the queue summary's definitions on a hand-built trace
      - name: Instrument tests
        run: cargo test --release --features trace --lib --example occupancy

      - name: Occupancy
        env:
          ROUNDS: ${{ inputs.rounds || '6' }}
          THREADS: ${{ inputs.threads || '' }}
          ARGS: ${{ inputs.args || '' }}
        run: |
          # (ARGS is split into words: e.g. --placements packed/spread)
          # shellcheck disable=SC2086
          just bench-occupancy --rounds "$ROUNDS" ${THREADS:+--threads "$THREADS"} $ARGS --out occupancy.json \
            --meta "runner=github-hosted ${{ runner.os }}" --meta "run=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            | tee occupancy.txt
          { echo '```text'; cat occupancy.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      # The trace under a team plan, forced: CI's runners are below the policy's 6 physical
      # cores, so it plans workers here. Every traced round must be complete, and every run
      # must have run the plan forced
      - name: Occupancy, teams of 2 (the trace's completeness)
        run: |
          just bench-occupancy --threads 4 --teams 2 --rounds 2 --out occupancy-teams.json | tee occupancy-teams.txt
          python3 - <<'PY'
          import json
          d = json.load(open("occupancy-teams.json"))
          rounds = d["settings"]["rounds"]
          for r in d["results"]:
              for mode in ("timeline", "full"):
                  got = r[mode]["complete_rounds"]
                  assert got == rounds, f"{r['threads']} threads, {mode}: {got} complete rounds of {rounds}"
          plans = {w.split("=", 1)[1] for run in d["runs"] for w in run["line"].split() if w.startswith("plan=")}
          assert plans == {"teams2x2"}, f"the runs' plans: {plans}"
          print(f"teams of 2: every traced round complete ({rounds} of {rounds}), every run on teams2x2")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: occupancy-${{ github.sha }}
          path: |
            occupancy.json
            occupancy.txt
            occupancy-teams.json
            occupancy-teams.txt

name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      # the benchmark harness's own tests (examples/ab.rs: CPU lists, cores, --spread)
      - name: Harness tests
        run: cargo test --example ab
      # the guarded service A/B's judge, with its producer driven for real: `ab run` with
      # stand-in children that succeed, exit 17, are killed or write nothing, each record judged
      - name: The guarded service A/B's producer and judge (stand-in children, untimed)
        run: |
          cargo build --example ab
          SG_AB=target/debug/examples/ab SG_REQUIRE_AB=1 python3 bench/test_service_guarded.py
      # the scanner diagnostic's harness (examples/par_scan.rs): a panic at each role of each
      # arm ends the decode, and the finder against the bit-by-bit reference
      - name: The scan harness's fault and finder tests
        run: timeout 600 cargo test --example par_scan
      # bench/alternatives has its own lock, on this crate by path, and master's benchmark
      # builds it --locked: a version bump that leaves it behind fails here, not only there
      - name: The benchmark alternatives' lock
        run: cargo metadata --locked --format-version 1 --manifest-path bench/alternatives/Cargo.toml > /dev/null

  # examples/fuzz.rs, briefly: the classic candidates (sequential, parallel) and the
  # pipeline cases (the shipped default, 3 x 3 pipelined with park and small, forced
  # through each default entry point; docs/journal/2026-11-09-pipeline-fuzz-and-mutation.md),
  # 30 s each at fixed seeds, on the fuzz profile (debug assertions and overflow checks on).
  # A failure's inputs are uploaded.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile fuzz --example fuzz
      - name: Classic candidates
        run: target/fuzz/examples/fuzz 30 1 fuzz-failures/classic classic
      - name: Pipeline candidates
        run: target/fuzz/examples/fuzz 30 1 fuzz-failures/pipeline pipeline
      - name: Service candidates
        run: target/fuzz/examples/fuzz 30 1 fuzz-failures/service service
      # (the plain teams, forced by their plan: no default selects them on these runners)
      - name: Plain-team candidates
        run: target/fuzz/examples/fuzz 30 1 fuzz-failures/teams teams
      - name: The failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: fuzz-failures/
          if-no-files-found: ignore

  # bench/submit.sh, the workstation evidence submission (RULES C5), against a scratch
  # repository and a stand-in for gh: archived once, posted once, retried without a rerun
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Submission tests
        run: python3 bench/test_submit.py
      # bench-par-scan's reporter, input anchoring and step supervisor (docs/journal/2026-11-10-parallel-scan.md)
      - name: The scan diagnostic's reporter, inputs and supervisor
        run: pipx run pytest -p no:cacheprovider bench/test_par_scan_knee.py bench/test_par_scan_inputs.py bench/test_bounded.py bench/test_par_scan_finish.py
      # bench-share-nothing's judge, schedule, preflight and drive (it uses bench/bounded.py and
      # bench/par_scan_finish.sh, tested above; docs/journal/2026-11-10-share-nothing-pricing.md)
      - name: The share-nothing diagnostic's judge, schedule, preflight and drive
        run: sudo apt-get install -y -qq lbzip2 > /dev/null && pipx run pytest -p no:cacheprovider bench/test_share_nothing.py
      - name: Install just
        uses: taiki-e/install-action@64adfd9e935fa438859b9e080fd026720b2ba070 # tag=just
        with:
          tool: just@1.38.0
      - name: Selective Cells i9 queue preparation (untimed)
        run: python3 bench/test_cells_selective_i9.py
      - name: One-core i9 recipe (untimed)
        run: ONECORE_REQUIRE_JUST=1 python3 bench/test_onecore_recipe.py
      - name: The recorder check's exit through the bundle and submission (stand-ins, untimed)
        run: python3 bench/test_telemetry_check.py
      - name: The target-gated noninferiority judge and its verdict gate (untimed; scipy for the power check where installed)
        run: |
          python3 bench/test_svc_target_check.py
          python3 bench/test_service_tg.py
          python3 bench/test_tg_ni_gate.py
          python3 bench/test_tg_ni_pilot.py
      - name: The target preflight's exits through the bundle and submission (stand-ins, untimed)
        run: python3 bench/test_svc_target.py
      - name: The guarded service A/B's judge and admission (its witnesses)
        run: python3 bench/test_service_guarded.py
      - name: The guarded service A/B's recipe end to end, every exit (stand-ins, untimed)
        run: python3 bench/test_service_guarded_recipe.py
      - name: The target-gated registration's recipe end to end, every exit (stand-ins, untimed)
        run: python3 bench/test_service_tg_recipe.py

  get-python-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Get Python versions
        id: get-versions
        run: |
          MIN_VERSION=$(grep -oP 'requires-python\s*=\s*">=\K[0-9]+(\.[0-9]+)+' pyproject.toml)
          VERSIONS=$(uv python list --python-preference only-managed 2>/dev/null |
            grep -oP 'cpython-\K[0-9]+\.[0-9]+(?=\.[0-9]+-[a-z])' |
            sort -Vu |
            awk -v min="$MIN_VERSION" '
              BEGIN { ok = 0 }
              $0 == min { ok = 1 }
              ok { print }
            ' |
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  python:
    needs: get-python-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.get-python-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the package and its test dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: ty
        run: uv run --group typing ty check

name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      # the run-fed research (the `run-fed` feature: mtf::mtf_runs, src/run_stage.rs): its
      # emitter against the reference on every MTF test stream, its table's own tests, the
      # doc tests that show no unchecked `Sorted` can be made, and the diagnostic's own
      # (its record writer against the verifier's fixture); and the run-fed leader's
      # (src/parallel/run_team.rs, tests/run_fed_leader.rs: docs/journal/2026-11-09-run-fed-leader.md)
      - name: Run-fed research tests
        run: |
          cargo test --features run-fed --test mtf_kernels
          cargo test --features run-fed --lib run_stage
          cargo test --features run-fed --doc run_stage
          cargo test --features run-fed --example run_fed_stage
          cargo test --features run-fed --lib run_team
          cargo test --features run-fed --test run_fed_leader
      # the benchmark harness's own tests (examples/ab.rs: CPU lists, cores, --spread)
      - name: Harness tests
        run: cargo test --example ab
      # bench/alternatives has its own lock, on this crate by path, and master's benchmark
      # builds it --locked: a version bump that leaves it behind fails here, not only there
      - name: The benchmark alternatives' lock
        run: cargo metadata --locked --format-version 1 --manifest-path bench/alternatives/Cargo.toml > /dev/null

  # bench/submit.sh, the workstation evidence submission (RULES C5), against a scratch
  # repository and a stand-in for gh: archived once, posted once, retried without a rerun
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Submission tests
        run: python3 bench/test_submit.py
      # the run-fed diagnostic's admission verifier and contended-copy statuses, on fixtures
      - name: Run-fed verifier tests
        run: python3 bench/test_run_fed_stage.py

  get-python-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Get Python versions
        id: get-versions
        run: |
          MIN_VERSION=$(grep -oP 'requires-python\s*=\s*">=\K[0-9]+(\.[0-9]+)+' pyproject.toml)
          VERSIONS=$(uv python list --python-preference only-managed 2>/dev/null |
            grep -oP 'cpython-\K[0-9]+\.[0-9]+(?=\.[0-9]+-[a-z])' |
            sort -Vu |
            awk -v min="$MIN_VERSION" '
              BEGIN { ok = 0 }
              $0 == min { ok = 1 }
              ok { print }
            ' |
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  python:
    needs: get-python-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.get-python-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the package and its test dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: ty
        run: uv run --group typing ty check

name: Test

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # One toolchain (rust-toolchain.toml): every workflow that installs Rust names its
      # channel, unless the line says why not (`# not the pin: ...`: Miri's nightly, a
      # registration's own toolchain), and this job runs it
      - name: The pinned toolchain everywhere
        run: |
          pin=$(sed -nE 's/^channel = "([^"]+)"$/\1/p' rust-toolchain.toml)
          [ -n "$pin" ] || { echo "::error::rust-toolchain.toml names no channel"; exit 1; }
          v=${pin//./\\.}
          bad=$(grep -nE '^\s*(- )?uses: dtolnay/rust-toolchain@|^\s*rust-toolchain: ' .github/workflows/*.yml \
            | grep -vE "dtolnay/rust-toolchain@$v( |$)|rust-toolchain: $v( |$)|not the pin" || true)
          [ -z "$bad" ] || { echo "::error::Rust installed at another version than rust-toolchain.toml's $pin:"; echo "$bad"; exit 1; }
          rustc -V | tee /dev/stderr | grep -q "^rustc $v " || { echo "::error::this job's rustc is not $pin"; exit 1; }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Tests
        run: cargo test
      # the benchmark harness's own tests (examples/ab.rs: CPU lists, cores, --spread)
      - name: Harness tests
        run: cargo test --example ab
      # the Cells memory-dose experiment's research build (src/dose.rs, #145 LOG 6879466310):
      # with a nonzero dose of each kind, byte-identical through the Workers plan, and engaging
      # the phase counters' research build (src/phase.rs, #145 LOG 6884716103, trimmed by
      # LOG 6893084445): its counter paths driven with the software pass (the runner has no
      # PMU), byte-identical, and with no pass counting nothing
      - name: The phase-counter build (research feature)
        run: |
          cargo test --features phase-counters --lib phase::
          cargo test --features phase-counters --test phase --test phase_off
      # the induction recorder (#145, QUEUED 6915302968): the replay against the kernel on
      # arbitrary columns, tampered logs refused, every block of the test corpora recorded
      # and checked; then a file of the repository's Markdown recorded (MONODROMY's prose
      # recipe) and every step replayed again by the Python reader
      - name: The induction recorder (research feature)
        run: |
          cargo test --release --features induction-trace --lib itrace::
          cargo test --release --features induction-trace --test induction_trace
          git ls-files 'docs/**/*.md' '*.md' | sort -u | xargs cat | bzip2 -9 > prose.bz2
          cargo run --release --features induction-trace --example induction_trace -- prose.bz2 irec 1 0
          python3 bench/irec.py irec --check
      - name: The dose build (research feature)
        run: |
          MIBZ2_DOSE_MB=1 cargo test --features dose --test dose --lib dose::
          MIBZ2_DOSE_MB=1 MIBZ2_DOSE_KIND=chase cargo test --features dose --test dose
      # the lazy crossover's reported readings (`just bench-lazy-crossover`), on a made-up
      # run: the memory dose of each workers arm, and each arm's peak memory
      - name: The lazy crossover's reading (made-up run)
        run: |
          python3 bench/lazy_crossover.py bench/lazy_crossover_example_runs.jsonl bench/lazy_crossover_example_dose.jsonl | tee dose.txt
          grep -q '59.8% with a slot for every letter, 20.0% with lazy letters' dose.txt
          grep -q 'mibz2-workers-lazy *110 *170' dose.txt
      # a two-arm adoption run's reading (`bench/two_arm.py`; `just bench-w12`, as #481's
      # `bench-cores-less-one`): each verdict on synthetic runs, Holm's arithmetic, a moved
      # control, and no verdict from incomplete or malformed records or metadata, the
      # Researcher's fabricated bundle among them
      - name: The two-arm adoption reading (synthetic runs)
        run: python3 bench/test_two_arm.py
      # the counters' reader (`bench/counters.py`; `just bench-w12`'s L2 diagnostic), driven
      # with a stub perf and child: a complete run read, and every defect leaves no report
      - name: The counters reader (stub perf)
        run: python3 bench/test_counters.py
      # the memory-lever experiment's staged Cells kernel (#145 QUEUED 6901989466; its lazy
      # kernel is production's now, tested above): against the original induction state by
      # state, the store fence's model, the public route, the harness's two arms built, the
      # store fence read in the compiled library (and the staged code absent without the
      # feature), and the sign reading on a made-up run
      - name: The memory-lever build (research feature)
        run: |
          cargo test --features memory-lever --lib cells::
          cargo test --features memory-lever --example ab
          cargo build --features memory-lever --example lever_counts
          bash bench/memory_lever_fence.sh
          python3 bench/memory_lever.py bench/memory_lever_example.jsonl | tee lever.txt
          grep -q 'below the ratio at 4 in 10 of 10 rounds' lever.txt
          grep -q 'below the ratio at 4 in 5 of 10 rounds' lever.txt
      # the guarded service A/B's judge, with its producer driven for real: `ab run` with
      # stand-in children that succeed, exit 17, are killed or write nothing, each record judged
      - name: The guarded service A/B's producer and judge (stand-in children, untimed)
        run: |
          cargo build --example ab
          SG_AB=target/debug/examples/ab SG_REQUIRE_AB=1 python3 bench/test_service_guarded.py
      # the scanner diagnostic's harness (examples/par_scan.rs): a panic at each role of each
      # arm ends the decode, and the finder against the bit-by-bit reference
      - name: The scan harness's fault and finder tests
        run: timeout 600 cargo test --example par_scan
      # bench/alternatives has its own lock, on this crate by path, and master's benchmark
      # builds it --locked: a version bump that leaves it behind fails here, not only there
      - name: The benchmark alternatives' lock
        run: cargo metadata --locked --format-version 1 --manifest-path bench/alternatives/Cargo.toml > /dev/null

  # The moonshot scorer (bench/moonshot/README.md): its statistics, gate and proxy reading
  # (Python), the gate's own checks (Rust), the gate passed by the null candidate and by
  # opend, and the proxy's Valgrind tool built and run on two blocks. Untimed: the scorer's
  # timings are container evidence only, never CI's
  moonshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: bench/moonshot -> target
      - name: The scorer's statistics, gate verdict and proxy reading
        run: python3 bench/moonshot/test_moonshot.py
      - name: The harness's format, lints and tests
        run: |
          cargo fmt --manifest-path bench/moonshot/Cargo.toml --check
          cargo clippy --release --locked --manifest-path bench/moonshot/Cargo.toml --all-targets -- -D warnings
          cargo test --release --locked --manifest-path bench/moonshot/Cargo.toml
          cargo build --release --locked --manifest-path bench/moonshot/Cargo.toml
      - name: The gate, quick set (the null candidate, opend)
        run: |
          bench/moonshot/target/release/moonshot check --quick --arm candidate | tail -1
          bench/moonshot/target/release/moonshot check --quick --arm opend | tail -1
      - name: The proxy's tool on two blocks
        run: |
          sudo apt-get install -y -qq valgrind > /dev/null
          bash bench/moonshot/chaingrind/build.sh target/chaingrind
          git ls-files 'src/*.rs' | xargs cat | bzip2 -9 > moonshot.bz2
          M=bench/moonshot/target/release/moonshot
          $M extract --file moonshot.bz2 --blocks 0,1 --out moonshot.sym
          VALGRIND_LIB=$PWD/target/chaingrind valgrind --tool=chaingrind --llc-kb=2048 \
            $M proxy --arm lazy --symbols moonshot.sym 2> proxy.txt
          python3 -c "import sys; sys.path.insert(0, 'bench/moonshot'); import moonshot as m; x = m.proxy_metrics(m.parse_proxy(open('proxy.txt').read())); print(x); assert x['cycles_per_byte'] > 0"

  # examples/fuzz.rs, briefly: the classic candidates (sequential, parallel) and the
  # pipeline cases (the shipped default, 3 x 3 pipelined with park and small, forced
  # through each default entry point; docs/journal/2026-11-09-pipeline-fuzz-and-mutation.md),
  # 30 s each at fixed seeds, on the fuzz profile (debug assertions and overflow checks on).
  # A failure's inputs are uploaded.
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --profile fuzz --example fuzz
      - name: Classic candidates
        run: target/fuzz/examples/fuzz 30 1 fuzz-failures/classic classic
      - name: Pipeline candidates
        run: target/fuzz/examples/fuzz 30 1 fuzz-failures/pipeline pipeline
      - name: Service candidates
        run: target/fuzz/examples/fuzz 30 1 fuzz-failures/service service
      - name: Cells candidates (forced route and admission reach asserted)
        run: target/fuzz/examples/fuzz 30 42 fuzz-failures/cells cells
      # (the plain teams, forced by their plan: no default selects them on these runners)
      - name: Plain-team candidates
        run: target/fuzz/examples/fuzz 30 1 fuzz-failures/teams teams
      # (research feature `memory-lever`: the Cells check again, with the experiment's two
      # kernels held to Cells' and ForcedCells' output, errors and routes)
      - name: Memory-lever candidates
        run: |
          cargo build --profile fuzz --example fuzz --features memory-lever
          target/fuzz/examples/fuzz 30 42 fuzz-failures/lever cells
      - name: The failing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: fuzz-failures/
          if-no-files-found: ignore

  # bench/submit.sh, the workstation evidence submission (RULES C5), against a scratch
  # repository and a stand-in for gh: archived once, posted once, retried without a rerun
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Submission tests
        run: python3 bench/test_submit.py
      # bench/run-queue.sh and bench/await-submit.sh (`just workstation-queue`) against a
      # scratch origin, stand-ins for just and gh, and a scratch HOME: once per recipe and
      # commit, state in the XDG state directory, HOLD, notices
      - name: The workstation queue
        run: python3 bench/test_workstation_queue.py
      # bench-cells-dose's statistic, rule and validity (bench/dose.py) on synthetic grids
      - name: The dose experiment's verdict
        run: python3 bench/test_dose.py
      # bench-cells-imc's statistic, rule and validity (bench/cells_imc.py) on synthetic
      # readings, and its collection driven end to end with stand-ins for ab and perf
      - name: The working-set premise test's verdict
        run: python3 bench/test_cells_imc.py
      # bench-par-scan's reporter, input anchoring and step supervisor (docs/journal/2026-11-10-parallel-scan.md)
      - name: The scan diagnostic's reporter, inputs and supervisor
        run: pipx run pytest -p no:cacheprovider bench/test_par_scan_knee.py bench/test_par_scan_inputs.py bench/test_bounded.py bench/test_par_scan_finish.py
      # bench-share-nothing's judge, schedule, preflight and drive (it uses bench/bounded.py and
      # bench/par_scan_finish.sh, tested above; docs/journal/2026-11-10-share-nothing-pricing.md)
      - name: The share-nothing diagnostic's judge, schedule, preflight and drive
        run: sudo apt-get install -y -qq lbzip2 > /dev/null && pipx run pytest -p no:cacheprovider bench/test_share_nothing.py
      - name: Install just
        uses: taiki-e/install-action@64adfd9e935fa438859b9e080fd026720b2ba070 # tag=just
        with:
          tool: just@1.38.0
      - name: One-core i9 recipe (untimed)
        run: ONECORE_REQUIRE_JUST=1 python3 bench/test_onecore_recipe.py
      - name: The recorder check's exit through the bundle and submission (stand-ins, untimed)
        run: python3 bench/test_telemetry_check.py
      - name: The target-gated noninferiority judge and its verdict gate (untimed; scipy for the power check where installed)
        run: |
          python3 bench/test_svc_target_check.py
          python3 bench/test_service_tg.py
          python3 bench/test_tg_ni_gate.py
          python3 bench/test_tg_ni_pilot.py
      - name: The target preflight's exits through the bundle and submission (stand-ins, untimed)
        run: python3 bench/test_svc_target.py
      - name: The guarded service A/B's judge and admission (its witnesses)
        run: python3 bench/test_service_guarded.py
      - name: The guarded service A/B's recipe end to end, every exit (stand-ins, untimed)
        run: python3 bench/test_service_guarded_recipe.py
      - name: The target-gated registration's recipe end to end, every exit (stand-ins, untimed)
        run: python3 bench/test_service_tg_recipe.py

  get-python-versions:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.get-versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Get Python versions
        id: get-versions
        run: |
          MIN_VERSION=$(grep -oP 'requires-python\s*=\s*">=\K[0-9]+(\.[0-9]+)+' pyproject.toml)
          VERSIONS=$(uv python list --python-preference only-managed 2>/dev/null |
            grep -oP 'cpython-\K[0-9]+\.[0-9]+(?=\.[0-9]+-[a-z])' |
            sort -Vu |
            awk -v min="$MIN_VERSION" '
              BEGIN { ok = 0 }
              $0 == min { ok = 1 }
              ok { print }
            ' |
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "versions=$VERSIONS" >> $GITHUB_OUTPUT

  python:
    needs: get-python-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJson(needs.get-python-versions.outputs.versions) }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install the package and its test dependencies
        run: uv sync --python ${{ matrix.python-version }} --group test

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest

  typing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.99.1
      - uses: Swatinem/rust-cache@v2
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: ty
        run: uv run --group typing ty check

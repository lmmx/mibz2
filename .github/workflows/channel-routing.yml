# The routing tripwire for the compact30 channel (.github/coordination/coord.py).
#
# The coordinator's assignments go to a role's inbox (#160 Optimizer, #161 Guardian, #162
# Researcher), or are staged on the channel PR #145 as TYPE: QUEUED while the role is busy;
# the channel PR wakes only the coordinator. On each new comment on those four PRs, this
# checks the header against that routing. A correct comment ends the run silently.
#
# A misrouted one gets one failing check run on the channel PR #145's head commit, named for
# the comment, whichever of the four PRs it is on. That marks #145 red and wakes the
# coordinator, which is subscribed to #145's checks; no role listens to #145. It is a check
# run, not a comment: #145 is locked (PROTOCOL.md §1), so GITHUB_TOKEN can't comment there,
# and a comment in an inbox would wake that role's Work task as if it were a brief. If the
# warning can't be delivered, this run fails instead, so the failure is still visible.
#
# The tripwire never edits, deletes, moves or re-posts a comment, and never dispatches
# anything. It skips bots, and what GITHUB_TOKEN creates starts no workflow runs.
name: Channel routing

on:
  issue_comment:
    types: [created]
  pull_request:
    paths:
      - ".github/coordination/**"
      - ".github/workflows/channel-routing.yml"
  push:
    branches: [master]
    paths:
      - ".github/coordination/**"
      - ".github/workflows/channel-routing.yml"

permissions:
  contents: read

jobs:
  tripwire:
    if: >-
      github.event_name == 'issue_comment' &&
      contains(fromJSON('[145, 160, 161, 162]'), github.event.issue.number) &&
      github.event.comment.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/coordination
      - name: Check the comment's routing
        env:
          # untrusted text: only ever read from the environment, never interpolated
          BODY: ${{ github.event.comment.body }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENT: ${{ github.event.comment.id }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          warning=$(printf '%s' "$BODY" | python3 .github/coordination/coord.py warn --issue "$ISSUE" --comment-id "$COMMENT")
          if [ -z "$warning" ]; then
            echo "comment $COMMENT on #$ISSUE: routed correctly"
            exit 0
          fi
          echo "::warning::comment $COMMENT on #$ISSUE is misrouted"
          printf '%s\n' "$warning"
          name="routing tripwire: comment $COMMENT"
          head=$(gh api "repos/$REPO/pulls/145" --jq .head.sha)
          seen=$(gh api -X GET "repos/$REPO/commits/$head/check-runs" -f check_name="$name" --jq .total_count)
          if [ "$seen" != 0 ]; then
            echo "already flagged on #145 ($head)"
            exit 0
          fi
          gh api "repos/$REPO/check-runs" -f name="$name" -f head_sha="$head" \
            -f status=completed -f conclusion=failure \
            -f "output[title]=Misrouted: comment $COMMENT on #$ISSUE" \
            -f "output[summary]=$warning" --jq .html_url

  tests:
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: .github/coordination
      - name: Unit tests
        run: python3 -m unittest discover -s .github/coordination -v

# Sets or clears the signal tag that bench/await-submit.sh waits for on a workstation:
#   ready/<recipe>  a lightweight tag at the exact commit to run;
#   hold/<recipe>   stop the waiting script without running anything.
# A tag pushed with GITHUB_TOKEN starts no other workflow.
#
# Run requests (claim declarative-ready-signal): a participant that can push a branch but not
# dispatch this workflow publishes refs/heads/run-request/<recipe>/<id>
# (python3 bench/run_requests.py publish ...). The reconcile job, on a schedule and only ever
# from the default branch, reads every request as untrusted data and sets the same ready/hold
# tags, with a receipt tag, only when the recipe is queued, the queue claim's lease is live,
# the exact head is reviewed and green and nothing holds it (bench/run_requests.py's docstring
# has every condition). It never checks out or runs a request or a candidate. A push to a
# request branch starts nothing: `schedule` runs this file as it is on the default branch.
name: Run signal

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      signal:
        description: "ready, hold, clear (delete both tags), or reconcile (decide run requests now)"
        required: true
        type: choice
        options: [ready, hold, clear, reconcile]
      recipe:
        description: "the recipe, e.g. bench-pipelined-default (any value for reconcile)"
        required: true
        type: string
      sha:
        description: "for ready: the full 40-character commit to run"
        required: false
        type: string

permissions:
  contents: write

# manual signals and the reconciler take turns, so neither reads tags the other is moving
concurrency:
  group: run-signal
  cancel-in-progress: false

jobs:
  signal:
    if: github.event_name == 'workflow_dispatch' && inputs.signal != 'reconcile'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set the signal
        env:
          SIGNAL: ${{ inputs.signal }}
          RECIPE: ${{ inputs.recipe }}
          SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$RECIPE" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "bad recipe name: $RECIPE"; exit 1; }
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          case "$SIGNAL" in
            ready)
              [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "ready needs a full 40-character sha"; exit 1; }
              git cat-file -e "$SHA^{commit}" || { echo "no such commit: $SHA"; exit 1; }
              # moves the tag when it is already set (a repeat recipe, such as each release's
              # release scaling): the waiter runs once per commit, so the new commit runs
              git tag -f "ready/$RECIPE" "$SHA"
              git push -f origin "refs/tags/ready/$RECIPE"
              ;;
            hold)
              git tag -f "hold/$RECIPE" HEAD
              git push -f origin "refs/tags/hold/$RECIPE"
              ;;
            clear)
              git push origin --delete "refs/tags/ready/$RECIPE" "refs/tags/hold/$RECIPE" || true
              ;;
          esac
          git ls-remote --tags origin "refs/tags/ready/$RECIPE" "refs/tags/hold/$RECIPE"
          # the signal is the tag on origin, not this run's success: check it landed
          if [[ "$SIGNAL" == ready ]]; then
            got=$(git ls-remote --tags origin "refs/tags/ready/$RECIPE" | awk '{print $1}')
            [[ "$got" == "$SHA" ]] || { echo "::error::ready/$RECIPE is at '${got:-nothing}' on origin, not $SHA"; exit 1; }
          fi

  reconcile:
    # scheduled runs use the default branch's copy of this file and of bench/run_requests.py;
    # a manual reconcile must be dispatched on the default branch too
    if: >-
      (github.event_name == 'schedule' || inputs.signal == 'reconcile')
      && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@v4
        with:
          # history for the ancestry check, without the evidence branch's tarballs: blobs are
          # fetched only when read (a request, a lease, the queue file, a claim)
          fetch-depth: 0
          filter: blob:none
          persist-credentials: true
      - name: Decide the run requests and set the signals they earn
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          python3 bench/run_requests.py reconcile --apply --default "$DEFAULT_BRANCH"

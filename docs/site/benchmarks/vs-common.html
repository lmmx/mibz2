const nowUtc = () => new Date().toISOString().slice(0, 16) + "Z";
const $ = id => document.getElementById(id);
const flat = kids => kids.flat(Infinity).filter(k => k != null && k !== false && k !== "");

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null) continue;
    if (k === "style") Object.assign(e.style, v);
    else if (k === "class") e.className = v;
    else e.setAttribute(k, v);
  }
  e.append(...flat(kids));
  return e;
}
const fill = (node, ...kids) => node.replaceChildren(...flat(kids));
const link = (href, text) => (href ? el("a", { href }, text) : text);

function renderValue(v) {
  if (Array.isArray(v)) return el("ul", { class: "plain" }, v.map(x => el("li", {}, renderValue(x))));
  if (v && typeof v === "object") {
    return el("dl", { class: "kv" }, Object.entries(v).map(([k, x]) => [el("dt", {}, k), el("dd", {}, renderValue(x))]));
  }
  const s = String(v);
  const m = s.match(/^(https?:\/\/\S+)(.*)$/s);
  return m ? [el("a", { href: m[1] }, m[1]), m[2]] : s;
}

const fmtR = r => `${r.toFixed(2)}×`;
const mbsText = x => x >= 100 ? x.toFixed(0) : x >= 10 ? x.toFixed(1) : x.toFixed(2);
const span = xs => {
  const lo = Math.min(...xs), hi = Math.max(...xs);
  return lo === hi ? fmtR(lo) : `${lo.toFixed(2)}–${fmtR(hi)}`;
};
const list = xs => xs.length < 3 ? xs.join(" and ") : `${xs.slice(0, -1).join(", ")} and ${xs[xs.length - 1]}`;

function checkRows(rows) {
  if (!Array.isArray(rows) || !rows.length) throw new Error("no rows");
  for (const r of rows) {
    const bad = () => new Error("bad row " + JSON.stringify(r).slice(0, 60));
    if (!Array.isArray(r) || r.length !== 6 || typeof r[0] !== "string" || typeof r[1] !== "string") throw bad();
    if (![r[2], r[3], r[4]].every(Number.isFinite)) throw bad();
    if (!r[5] || typeof r[5] !== "object") throw bad();
    for (const x of Object.values(r[5])) {
      if (!Array.isArray(x) || x.length !== 3 || !x.every(Number.isFinite)) throw bad();
    }
  }
  return rows;
}

function compare(a, b) {
  const key = r => `${r[0]}/${r[2]}`;
  const nums = r => [r[3], r[4], ...Object.keys(r[5]).sort().flatMap(k => r[5][k])];
  const names = r => Object.keys(r[5]).sort().join(",");
  const m = new Map(a.map(r => [key(r), r]));
  let n = 0, bad = Math.abs(a.length - b.length);
  for (const r of b) {
    const s = m.get(key(r));
    if (!s) { bad++; continue; }
    const fa = nums(s), fb = nums(r);
    if (names(s) !== names(r) || s[1] !== r[1] || fa.length !== fb.length) { bad++; continue; }
    fa.forEach((x, i) => { n++; if (x !== fb[i] && !(Math.abs(x - fb[i]) < 1e-9)) bad++; });
  }
  return bad === 0
    ? { ok: true, text: `the live source page matches this page's pinned snapshot: all ${n} values equal` }
    : { ok: false, short: `${bad} values differ from the snapshot`, text: `the live source page differs from the pinned snapshot in ${bad} of ${n} values` };
}

function view() {
  const threads = [...new Set(state.rows.map(r => r[2]))].sort((a, b) => a - b);
  if (!threads.includes(state.t)) state.t = threads[threads.length - 1];
  const rows = state.rows.filter(r => r[2] === state.t);
  const present = new Set(rows.flatMap(r => Object.keys(r[5])));
  const shown = DECODERS.filter(d => d.key === "mibz2" || (present.has(d.key) && (state.show === "all" || d.common)));
  let max = 1;
  for (const r of state.rows) for (const d of shown) if (r[5][d.key]) max = Math.max(max, r[5][d.key][2]);
  return { threads, rows, shown, present, max: Math.ceil(max) };
}

function barRow(key, ratio, lo, hi, n, max, label, tip, win) {
  const pips = el("div", { class: "pips", title: `${n} thread${n > 1 ? "s" : ""}` },
    Array.from({ length: n }, () => el("span", { class: "pip" })));
  const u = 100 / ratio; // one mibz2-time, as % of this bar's width
  const color = `var(--${key})`;
  const track = el("div", { class: "track" },
    el("div", {
      class: "bar", title: tip,
      style: {
        width: `${(ratio / max) * 100}%`,
        background: `repeating-linear-gradient(90deg, ${color} 0 calc(${u}% - 2px), transparent calc(${u}% - 2px) ${u}%)`,
      },
    }),
    lo == null ? null : el("div", { class: "whisk", title: tip, style: { left: `${(lo / max) * 100}%`, width: `${((hi - lo) / max) * 100}%` } }),
    el("span", { class: "val" + (win ? " win" : ""), style: { left: `${(Math.max(ratio, hi ?? 0) / max) * 100}%` } }, label));
  return el("div", { class: "row" }, el("div", { class: "name", style: { color }, title: key }, key), pips, track);
}

function seg(node, label, options, current, set) {
  fill(node, el("span", {}, label), options.map(([value, text]) => {
    const b = el("button", { type: "button", "aria-pressed": String(value === current) }, text);
    b.onclick = () => { set(value); render(); };
    return b;
  }));
}

function render() {

  seg($("show"), "decoders", [["common", "4"], ["all", String(v.present.size + 1)]], state.show, s => { state.show = s; });
  const grid = $("grid");
  fill(grid);
  for (const r of v.rows) {
    const [corpus, size, t, s, mbs, ratios] = r;
    const info = CORPUS_INFO[corpus];
    grid.append(el("section", { class: "panel" + (info && info[0] === "real data" ? " wide" : "") },
      el("h2", { title: info ? info[1] : null }, corpus, el("span", { class: "meta" }, size)),
      v.shown.map(d => {
        if (d.key === "mibz2") return barRow("mibz2", 1, null, null, t, v.max, `${mbs} MB/s`,
          `mibz2: ${mbs} MB/s of decompressed output (median wall time ${s.toFixed(3)} s); the reference, 1×`);
        const x = ratios[d.key];
        if (!x) return null;
        const [q, lo, hi] = x;
        const n = state.single.has(d.key) ? 1 : t;
        const ver = (state.src.versions || {})[d.key] || "?";
        // Derived, not measured: mibz2's MB/s over the ratio (the table has no MB/s of its own for them).
        const rate = mbsText(mbs / q);
        return barRow(d.key, q, lo, hi, n, v.max, [fmtR(q), el("span", { class: "rate" }, `${rate} MB/s`)],
          `${d.key} ${ver}${n === 1 && t > 1 ? " (one thread)" : ""}: ${fmtR(q)} mibz2's wall time, 95% interval ${lo}–${hi}; ` +
          `≈ ${rate} MB/s (mibz2's ${mbs} MB/s ÷ ${q}, derived)`,
          hi < 1);
      })));
  }
  const url = new URL(location.href);
  url.searchParams.set("threads", state.t);
  if (state.show === "all") url.searchParams.set("show", "all"); else url.searchParams.delete("show");
  history.replaceState(null, "", url);
  renderStamp();
  renderProvView();
}

function renderStamp() {
  const s = state.src;
  const c = $("checkLine");
  c.className = "check " + (state.check.ok ? "ok" : "warn");
  c.textContent = state.check.ok ? "" : (state.check.short || state.check.text);
  c.title = state.check.text;
  fill($("stamp"),
    link(s.commitUrl, s.commit || "?"), " · ", s.date || "?", " · ",
    link(s.runUrl, "run"), " · ", link(s.from, "source"), " · ",
    link(PAGE.repository, `v${PAGE.version}`));
}

// ---------- provenance panel ----------

function renderProvView() {
  const s = state.src;
  fill($("provView"),
    el("h3", {}, "Data in view"),
    renderValue({
      source: `${s.mode}: ${s.from}`, fetched: s.fetched,
      commit: s.commitUrl || s.commitFull || s.commit || "?",
      recorded: s.date || "?", pull_request: s.prUrl || "?",
      cpu: s.cpu || "?", rustc: s.rustc || "?", bench: s.bench || "?", rounds: s.rounds || "?",
      run: s.runUrl || "?", versions: s.versions || {},
      single_threaded: [...state.single].join(", "), check: state.check.text,
    }),
    el("p", {}, el("button", { class: "btn", id: "export", type: "button" }, "Save data.json"),
      " the data in view, its source and the full provenance below"));
  $("export").onclick = exportJson;
}

function renderProvStatic() {
  fill($("provStatic"),
    el("h3", {}, `Measurement (record ${SHA.slice(0, 7)} only)`), renderValue(PROV.measured),
    el("h3", {}, "Inputs"), renderValue(PROV.inputs),
    el("h3", {}, "Decoders"), renderValue(PROV.decoders),
    el("h3", {}, "Checked"), renderValue(PROV.checks),
    el("h3", {}, "This page"), renderValue(PROV.file),
    el("h3", {}, "Not captured"), renderValue(PROV.gaps),
    el("h3", {}, "Reproduce and modify"),
    REPRO.map(step => [el("p", {}, step.t), el("pre", {}, step.sh.join("\n"))]),
    el("p", {}, "data.json row layout: " + ROW_LAYOUT.join(" | ")));
}

function exportJson() {
  const out = {
    schema: SCHEMA, exported: nowUtc(), page: PAGE, row_layout: ROW_LAYOUT,
    view: state.src, single_threaded: [...state.single], check: state.check.text,
    rows: state.rows, provenance: PROV,
  };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "data.json" });
  document.body.append(a); a.click(); a.remove();
}

// ---------- loading ----------

function parseLive(html, url) {
  const doc = new DOMParser().parseFromString(html, "text/html");
  const abs = h => (h ? new URL(h, url).href : null);
  const h2 = [...doc.querySelectorAll("h2")].find(e => /Wall time against mibz2/i.test(e.textContent));
  let node = h2 && h2.nextElementSibling, table = null;
  while (node && !table && node.tagName !== "H2") {
    table = node.matches("table") ? node : node.querySelector("table");
    node = node.nextElementSibling;
  }
  if (!table) throw new Error("wall-time table not found");

  const raw = [...table.querySelectorAll("thead th")].map(th => th.textContent.trim());
  const heads = raw.map(h => h.replace(/[¹\s]+$/u, "").trim());
  const col = name => {
    const i = heads.indexOf(name);
    if (i < 0) throw new Error(`column '${name}' missing`);
    return i;
  };
  const iC = col("corpus"), iT = col("threads"), iS = col("mibz2 wall (median)"), iM = col("mibz2 MB/s");
  const decs = OTHERS.filter(k => heads.includes(k));
  if (!["lbzip2", "libbz2-rs", "libbzip2"].every(k => decs.includes(k))) throw new Error("a common decoder's column is missing");
  const single = decs.filter(k => /¹/.test(raw[heads.indexOf(k)]));
  const ratio = s => {
    const m = s.match(/([\d.]+)×\s*\(([\d.]+)[–-]([\d.]+)\)/);
    if (!m) throw new Error(`bad ratio '${s}'`);
    return m.slice(1, 4).map(Number);
  };
  const rows = [...table.querySelectorAll("tbody tr")].map(tr => {
    const td = [...tr.children].map(x => x.textContent.trim());
    const cm = td[iC].match(/^(\S+)\s*\(([^,]+),/);
    if (!cm) throw new Error(`bad corpus '${td[iC]}'`);
    return [cm[1], cm[2].trim(), +td[iT], parseFloat(td[iS]), parseFloat(td[iM]),
      Object.fromEntries(decs.map(k => [k, ratio(td[col(k)])]))];
  });
  checkRows(rows);

  const text = doc.body.textContent;
  // Versions: the toolchain line ("rustc …; pbz2 0.2.0; lbzip2 version 2.5; …").
  const versions = {};
  const line = (text.match(/rustc [^\n]*?;[^\n]*/) || [""])[0];
  for (const item of line.split(";")) {
    const m = item.trim().match(/^(\S+)\s+(.*)$/);
    if (!m || !OTHERS.includes(m[1]) || versions[m[1]]) continue;
    const v = m[2].match(/\d+(?:\.\d+)+/);
    if (v) versions[m[1]] = v[0];
  }
  const latest = [...doc.querySelectorAll("p")].find(p => /The latest record/.test(p.textContent));
  const cLink = latest && latest.querySelector('a[href*="/commit/"]');
  if (!cLink) throw new Error("commit link not found");
  const commitUrl = abs(cLink.getAttribute("href"));
  const envP = [...doc.querySelectorAll("p")].find(p => /·/.test(p.textContent) && /rustc/.test(p.textContent));
  const env = envP ? envP.textContent.split("·").map(x => x.trim()) : [];
  const pr = doc.querySelector('article a[href*="/pull/"]');
  const run = doc.querySelector('a[href*="/actions/runs/"]');
  const commitFull = commitUrl.split("/commit/")[1] || "";
  return {
    rows, single,
    src: {
      mode: "live fetch", from: url, fetched: nowUtc(),
      commit: cLink.textContent.trim(), commitFull, commitUrl,
      pr: pr ? (pr.textContent.match(/#(\d+)/) || [])[1] : (commitFull === SHA ? SNAP_SRC.pr : null),
      prUrl: pr ? abs(pr.getAttribute("href")) : (commitFull === SHA ? SNAP_SRC.prUrl : null),
      date: (latest.textContent.match(/\d{4}-\d{2}-\d{2}/) || ["?"])[0],
      // The page's "N cores" counts CPUs; the pinned record's own count is known.
      cpu: commitFull === SHA ? SNAP_SRC.cpu : (env[0] || "?"),
      rustc: env[1] || "?", bench: env[2] || "?",
      rounds: (text.match(/(\d+) rounds on one runner/) || [])[1] || "?",
      runUrl: run ? abs(run.getAttribute("href")) : url,
      versions,
    },
  };
}

async function fetchLive(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return parseLive(await r.text(), url);
}

async function fetchData(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  const j = await r.json();
  if (j.schema !== SCHEMA) throw new Error(`schema is not ${SCHEMA}`);
  return {
    rows: checkRows(j.rows), single: j.single_threaded || SNAP_SINGLE,
    src: { ...(j.view || {}), mode: "loaded data.json", from: new URL(url, location.href).href, fetched: nowUtc() },
  };
}

(async () => {
  renderProvStatic();
  render();
  const dataUrl = Q.get("data");
  if (!dataUrl && Q.has("pinned")) {
    state.check = { ok: true, text: "pinned snapshot: no network used" };
    render();
    return;
  }
  const url = dataUrl || Q.get("source") || DEFAULT_SOURCE;
  try {
    const got = dataUrl ? await fetchData(dataUrl) : await fetchLive(url);
    const sameRecord = got.src.commitFull === SHA;
    if (dataUrl) {
      state.check = { ok: true, text: "loaded data.json: not compared with the pinned snapshot" };
    } else if (sameRecord) {
      state.check = compare(SNAP_ROWS, got.rows);
    } else {
      state.check = { ok: false, short: `newer record ${got.src.commit}, unchecked`, text: `the source's latest record is ${got.src.commit}, not the pinned ` +
        `${SHA.slice(0, 7)}: showing it unchecked; the provenance below describes ${SHA.slice(0, 7)} only` };
    }
    state.rows = got.rows; state.single = new Set(got.single); state.src = got.src;
  } catch (e) {
    state.check = { ok: false, short: "offline: pinned snapshot", text: `fetching ${url} failed (${e.message || e}): showing the pinned snapshot` };
  }
  render();
})();
</script>
</body>
</html>

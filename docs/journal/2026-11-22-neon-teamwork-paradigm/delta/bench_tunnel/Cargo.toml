[package]
name = "bench_tunnel"
version = "0.1.0"
edition = "2021"

[dependencies]
mibz2 = { path = "../../../../..", features = ["moonshot"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

[[bin]]
name = "counts"
path = "src/counts.rs"

[[bin]]
name = "stage_census"
path = "src/stage_census.rs"

[[bin]]
name = "bench_zerorv"
path = "src/bench_zerorv.rs"

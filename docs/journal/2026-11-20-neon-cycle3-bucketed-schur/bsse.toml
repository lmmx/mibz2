[[edge]]
id = "forward_bucket_schur"
inputs = ["initial_bucket_queues", "p"]
output = "contracted_bucket_trace"
status = "verified"
dependent = true
cost = { W = "m + R_rt", D = "s + max_chain", B = "18*R_rt + 8*m", Q = "0 outside L2 (m + R_rt inside L2 bucket)", M = "12m" }
evidence = "Bucket-by-bucket Schur elimination (k = 0..close_k) with Exact Chain-Head Decomposition Lemma (proved; verified on 97,976 exhaustive small cases + 6 Wikidata blocks in verify_bsse.py). Working set per bucket is 8*bsize <= 128 KiB (L2-resident). Total routed edges R_rt <= m - |B_{s-1}|; measured R_rt = 0.488-0.635m at bsize=16384 (0.335-0.389m at s=4)."

[[edge]]
id = "reverse_position_and_slabbed_emit"

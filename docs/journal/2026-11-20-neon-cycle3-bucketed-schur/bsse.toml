output = "text"
status = "verified"
dependent = true
cost = { W = "n + m + R_rt", D = "s + max_chain", B = "n + 10m + 14*R_rt", Q = "0 outside L2 (m + R_rt inside L2 buckets and 112.5 KiB output slabs)", M = "n + 12m" }
evidence = "Reverse pass (j = close_k..0) answers req_u[k][j] in L2-resident pos[0..bsize], propagates along topological self_chain[j], and emits (off:17b, code:15b) (4 B/row) into C=8 L2-resident output slabs (112.5 KiB each), then spells each slab sequentially into out[0..n] with zero L2/DRAM pointer chasing. Verified byte-exact on 97,976 small cases and all 6 Wikidata blocks (5,399,692/5,399,692 bytes)."

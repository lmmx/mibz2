evidence = "Every arc c, LF c, ..., d (c a codomain start, d its first run head) is advanced one point a round; the frontier stays row-sorted by a bucket-by-symbol concatenation; arcs chain d -> LF(d), r dependent hops. Exact text against the LF walk on 23,093 small single-cycle cases and all six authenticated blocks (record 84). D: lmax + 1 = 848-17,545 rounds plus the r-hop chain; Q: one run lookup and one scattered byte write per row."

name = "in-place copy replay with labels from the arc walk (record 84's reduction)"
target = "text_replayed"
uses = ["counts_from_records", "maximal_runs", "lf_shifts", "lf_image_partition",
        "boundary_text_positions"]

[[edge]]
id = "arc_walk_labels"
inputs = ["runs", "lf_affine", "codomain_partition", "p"]
output = "run_label_sequences"
status = "verified"
cost = { W = "n", D = "lmax + r", B = "n", Q = "n", M = "n" }

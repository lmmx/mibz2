<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bestiarium Serpentium</title>
  <style>
    :root {
      --parchment: #f4ecda;
      --parchment-edge: #e5d8bc;
      --rule: #c5b492;
      --ink: #1c100a;
      --vermilion: #d22f1c;
      --carmine: #a3141c;
      --madder: #6e130f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--parchment-edge);
      color: var(--ink);
      font: 16px/1.5 Georgia, "Iowan Old Style", "Palatino Linotype", serif;
    }
    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 36px 20px 64px;
    }
    header {
      text-align: center;
      border-bottom: 1.5px solid var(--rule);
      padding-bottom: 18px;
      margin-bottom: 28px;
    }
    h1 {
      margin: 0 0 6px;
      font-weight: 400;
      font-size: clamp(26px, 4vw, 38px);
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--carmine);
    }
    header p {
      margin: 0;
      font-style: italic;
      color: var(--madder);
      font-size: 15px;
    }
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(310px, 1fr));
      gap: 22px;
    }
    .plate {
      margin: 0;
      background: var(--parchment);
      border: 1.5px solid var(--rule);
      padding: 16px 16px 14px;
      display: flex;
      flex-direction: column;
    }
    .frame {
      width: 100%;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(28, 16, 10, 0.14);
      background: #f7f0e0;
      padding: 8px;
      overflow: hidden;
    }
    .frame svg {
      width: 100%;
      height: 100%;
      display: block;
    }
    figcaption {
      width: 100%;
      margin-top: 12px;
      border-top: 1px solid rgba(28, 16, 10, 0.16);
      padding-top: 9px;
    }
    .plate-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 8px;
      flex-wrap: wrap;
    }
    .rubric {
      font-size: 18px;
      font-variant: small-caps;
      letter-spacing: 0.04em;
      color: var(--vermilion);
      font-weight: 600;
    }
    .file {
      font: 11.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--madder);
      white-space: nowrap;
    }
    .gloss {
      margin: 5px 0 0;
      font-size: 13.5px;
      font-style: italic;
      color: #4b382a;
    }
  </style>
</head>

  <use href="#ornament-aldus-leaf" x="158" y="12" width="44" height="36"/>
  <use href="#ornament-fleuron-left" x="108" y="72" width="36" height="22"/>
  <use href="#ornament-aldus-leaf" x="158" y="66" width="44" height="36"/>

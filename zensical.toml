[project]
copyright = "mibz2 is licensed under MIT OR Apache-2.0"
docs_dir = "docs/site"
edit_uri = "edit/master/docs/site/"
extra_css = ["assets/stylesheets/extra.css", "assets/stylesheets/bench.css"]
extra_javascript = ["assets/javascripts/bench.js"]
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Concepts" = [
    "concepts/index.md",
    { "What is checked, and when" = "concepts/checks.md" },
    { "How it works" = "concepts/how-it-works.md" },
    { "Prior work" = "concepts/prior-work.md" },
  ] },
  { "Benchmarks" = [
    "benchmarks/index.md",
    { "History" = "benchmarks/history.md" },
    { "Alternatives" = "benchmarks/alternatives.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "mibz2 (Python)" = "reference/api/mibz2.md" },
    { "mibz2 (Rust)" = "reference/rust.md" },
  ] },
  { "Background" = [
    "background/history.md",
    "background/journals.md",
  ] },
  { "Maintainers" = [
    "maintainers/development.md",
    "maintainers/documentation.md",
    "maintainers/releasing.md",
  ] },
]
repo_name = "lmmx/mibz2"
repo_url = "https://github.com/lmmx/mibz2"
site_author = "Louis Maddox"
site_description = "A bzip2 decoder built for memory-level parallelism."
site_name = "mibz2"
site_url = "https://lmmx.github.io/mibz2/"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
# (docs/generated/: the benchmark pages' tables, written by docs/scripts/bench_history.py
# before each build)
[project.markdown_extensions.pymdownx.snippets]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.search]

# API reference: mkdocstrings' Python handler (griffe, static analysis of python/; the
# compiled module is read from its stub, _mibz2.pyi)
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
filters = "public"
group_by_category = false
heading_level = 2
line_length = 88
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_if_no_docstring = true
show_labels = true
show_object_full_path = false
show_root_full_path = true
show_root_heading = false
show_root_members_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
summary = false

[project.theme]
features = [
  "content.action.copy",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]
favicon = "assets/favicon.png"
font.code = "IBM Plex Mono"
font.text = "IBM Plex Sans"
language = "en"
# the home page's illustration without its shadows (docs/scripts/hero.py mark), as PNG
logo = "assets/logo-header.png"
variant = "modern"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
accent = "custom"
media = "(prefers-color-scheme: light)"
primary = "custom"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "custom"
media = "(prefers-color-scheme: dark)"
primary = "custom"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lmmx/mibz2"
name = "mibz2 on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/mibz2/"
name = "mibz2 on PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/rust"
link = "https://crates.io/crates/mibz2"
name = "mibz2 on crates.io"

# llms.txt, llms-full.txt and a Markdown copy of each page listed here (<page>/index.md).
# Each description must equal the page's front-matter description (check_site.py).
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
mibz2 is a bzip2 decoder, block-parallel, its inverse BWT walked as interleaved chains
within each block, with byte-for-byte libbzip2 output and every block and stream CRC
checked, from Python (`mibz2.decompress`, `mibz2.open`) or Rust (`mibz2::decode`,
`mibz2::BzReader`). Install with `pip install mibz2` or `cargo add mibz2`. Each link below
is the Markdown version of a page of https://lmmx.github.io/mibz2/.
"""

[project.plugins.llmstxt.sections]
"Benchmarks" = [
  { "benchmarks/index.md" = "How mibz2's CI benchmark measures the decoder: the corpora, the rounds, the paired ratios and the modelled full-dump figure." },
  { "benchmarks/history.md" = "mibz2's decoding speed, CPU time and peak memory over master's commits, per corpus and thread count." },
  { "benchmarks/alternatives.md" = "mibz2 beside other bzip2 decoders on master's latest benchmark run: paired ratios with 95% intervals, per corpus and thread count." },
]
"Concepts" = [
  { "concepts/index.md" = "What mibz2 decodes, what it checks, and how it decodes in parallel." },
  { "concepts/checks.md" = "Which CRCs mibz2 checks and when, what its errors report, and the inputs it refuses." },
  { "concepts/how-it-works.md" = "mibz2's scanner thread, its workers, and the inverse BWT walked as interleaved chains." },
  { "concepts/prior-work.md" = "The work mibz2 builds on: libbzip2's format and checks, Kärkkäinen, Kempa and Puglisi's interleaved BWT inversion, and lbzip2's and pbzip2's block parallelism." },
]
"Get started" = [
  { "getting-started/installation.md" = "Install mibz2 from PyPI or crates.io." },
  { "getting-started/quickstart.md" = "Decode a .bz2 file with mibz2 from Python and from Rust." },
]
"Optional" = [
  { "background/history.md" = "Where mibz2 came from: written in wikidata-pq to decode the Wikidata dump, then moved to a repository of its own." },
  { "background/journals.md" = "mibz2's development journals: where they are and what each one records." },
  { "maintainers/development.md" = "The repository's layout, how to build, test and benchmark mibz2, and the commit conventions." },
  { "maintainers/documentation.md" = "How the documentation site and its benchmark pages are built, checked, tested and published to GitHub Pages." },
  { "maintainers/releasing.md" = "How mibz2 is released to crates.io and PyPI at one version: Deploy Release, Tag Release and Release Notes." },
]
"Reference" = [
  { "reference/index.md" = "mibz2's API in Python and in Rust." },
  { "reference/api/mibz2.md" = "The mibz2 Python package: decompress, open, BZ2Reader and DecodeError." },
  { "reference/rust.md" = "The mibz2 Rust crate: decode, decode_parallel, BzReader, StreamDecoder, scan, decode_blocks and Error." },
]
"Start here" = [
  { "index.md" = "A bzip2 decoder built for memory-level parallelism." },
]

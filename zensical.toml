[project]
copyright = "mibz2 is licensed under MIT OR Apache-2.0"
docs_dir = "docs/site"
edit_uri = "edit/master/docs/site/"
# The site's own stylesheets and scripts carry ?v=dev, which the site workflow replaces
# with the commit it builds, so a browser fetches each deploy's copy and not a cached one.
extra_css = [
  "assets/stylesheets/extra.css?v=dev",
  "assets/stylesheets/bench.css?v=dev",
  "assets/stylesheets/couriers.css?v=dev",
  "assets/stylesheets/blog.css?v=dev",
  "assets/stylesheets/frontier.css?v=dev",
  # KaTeX, for the maths pymdownx.arithmatex marks (pinned; assets/javascripts/katex.js)
  "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css",
]
extra_javascript = [
  "assets/javascripts/bench.js?v=dev",
  "assets/javascripts/couriers.js?v=dev",
  "assets/javascripts/blog.js?v=dev",
  "assets/javascripts/frontier.js?v=dev",
  "https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js",
  "assets/javascripts/katex.js?v=dev",
]
nav = [
  { "Home" = "index.md" },
  { "Get started" = [
    { "Installation" = "getting-started/installation.md" },
    { "Quickstart" = "getting-started/quickstart.md" },
  ] },
  { "Concepts" = [
    "concepts/index.md",
    { "Why 32 couriers beat one" = "concepts/couriers.md" },
    { "What is checked, and when" = "concepts/checks.md" },
    { "How it works" = "concepts/how-it-works.md" },
    { "Prior work" = "concepts/prior-work.md" },
  ] },
  { "Benchmarks" = [
    "benchmarks/index.md",
    { "History" = "benchmarks/history.md" },
    { "Alternatives" = "benchmarks/alternatives.md" },
    { "Throughput–memory frontier" = "benchmarks/frontier.md" },
  ] },
  { "Reference" = [
    "reference/index.md",
    { "mibz2 (Python)" = "reference/api/mibz2.md" },
    { "mibz2 (Rust)" = "reference/rust.md" },
  ] },
  { "Background" = [
    "background/history.md",
    "background/status.md",
    "background/journals.md",
  ] },
  { "Blog" = [
    "blog/index.md",
    { "A faster builder, a slower decoder" = "blog/2026-11-04-whole-decoder.md" },
    { "An autonomous agent team" = "blog/2026-11-04-autonomous-agent-team.md" },
    { "Building a smaller bzip2 decoding table" = [
      { "From 49 instructions to 12" = "blog/2026-11-04-compact30-constructor.md" },
      { "Technical appendix" = "blog/2026-11-04-compact30-constructor-notes.md" },
    ] },
    { "BWT space–time tradeoff" = "blog/2026-11-02-revisiting-space-time-tradeoff-bwt-inversion.md" },
    { "Memory-level parallelism in mibz2" = [
      { "Instructions, overlap and evidence" = "blog/2026-11-02-memory-level-parallelism.md" },
      { "Technical appendix" = "blog/2026-11-02-memory-level-parallelism-notes.md" },
    ] },
    { "Inverse-BWT memory interference" = "blog/2026-11-01-inverse-bwt-memory-interference.md" },
    { "Block dispatch in mibz2" = "blog/2026-11-01-block-dispatch.md" },
    { "32 lanes, 8.6 chains" = "blog/2026-10-31-room-walk-overlap.md" },
    { "Compact navigation tables for the inverse BWT" = "blog/2026-10-29-compact-navigation-tables.md" },
  ] },
  { "Maintainers" = [
    "maintainers/development.md",
    "maintainers/documentation.md",
    "maintainers/releasing.md",
  ] },
]
repo_name = "lmmx/mibz2"
repo_url = "https://github.com/lmmx/mibz2"
site_author = "Louis Maddox"
site_description = "A bzip2 decoder built for memory-level parallelism."
site_name = "mibz2"
site_url = "https://lmmx.github.io/mibz2/"

[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.tables]
[project.markdown_extensions.toc]
permalink = true
# maths: $...$ inline, $$...$$ displayed, rendered by KaTeX (assets/javascripts/katex.js)
[project.markdown_extensions.pymdownx.arithmatex]
generic = true
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.highlight]
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
# (docs/generated/: the benchmark pages' tables, written by docs/scripts/bench_history.py
# before each build)
[project.markdown_extensions.pymdownx.snippets]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.plugins.search]

# API reference: mkdocstrings' Python handler (griffe, static analysis of python/; the
# compiled module is read from its stub, _mibz2.pyi)
[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
inventories = ["https://docs.python.org/3/objects.inv"]
paths = ["python"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
filters = "public"
group_by_category = false
heading_level = 2
line_length = 88
members_order = "source"
merge_init_into_class = true
separate_signature = true
show_if_no_docstring = true
show_labels = true
show_object_full_path = false
show_root_full_path = true
show_root_heading = false
show_root_members_full_path = false
show_signature_annotations = true
show_source = false
show_symbol_type_heading = true
show_symbol_type_toc = true
signature_crossrefs = true
summary = false

[project.theme]
features = [
  "content.action.copy",
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.top",
  "search.highlight",
  "search.suggest",
  "toc.follow",
]
favicon = "assets/favicon.png"
font.code = "IBM Plex Mono"
font.text = "IBM Plex Sans"
language = "en"
# the home page's illustration without its shadows (docs/scripts/hero.py mark), as PNG
logo = "assets/logo-header.png"
variant = "modern"
custom_dir = "docs/overrides"

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
accent = "custom"
media = "(prefers-color-scheme: light)"
primary = "custom"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "custom"
media = "(prefers-color-scheme: dark)"
primary = "custom"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/lmmx/mibz2"
name = "mibz2 on GitHub"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/mibz2/"
name = "mibz2 on PyPI"

[[project.extra.social]]
icon = "fontawesome/brands/rust"
link = "https://crates.io/crates/mibz2"
name = "mibz2 on crates.io"

# llms.txt, llms-full.txt and a Markdown copy of each page listed here (<page>/index.md).
# Each description must equal the page's front-matter description (check_site.py).
[project.plugins.llmstxt]
full_output = "llms-full.txt"
markdown_description = """
mibz2 is a bzip2 decoder, block-parallel, its inverse BWT walked as interleaved chains
within each block, with byte-for-byte libbzip2 output and every block and stream CRC
checked, from Python (`mibz2.decompress`, `mibz2.open`) or Rust (`mibz2::decode`,
`mibz2::BzReader`). Install with `pip install mibz2` or `cargo add mibz2`. Each link below
is the Markdown version of a page of https://lmmx.github.io/mibz2/.
"""

[project.plugins.llmstxt.sections]
"Benchmarks" = [
  { "benchmarks/index.md" = "How mibz2's CI benchmark measures the decoder: the corpora, the rounds, the paired ratios and the modelled full-dump figure." },
  { "benchmarks/history.md" = "mibz2's decoding speed, CPU time and peak memory over master's commits, per corpus and thread count." },
  { "benchmarks/alternatives.md" = "mibz2 beside other bzip2 decoders on master's latest benchmark run: paired ratios with 95% intervals, per corpus and thread count." },
  { "benchmarks/frontier.md" = "Whether mibz2 can decode faster with less memory when blocks share the cache: the question, the method, and what has been measured so far." },
]
"Concepts" = [
  { "concepts/index.md" = "What mibz2 decodes, what it checks, and how it decodes in parallel." },
  { "concepts/couriers.md" = "mibz2's premise, memory-level parallelism in the inverse BWT, explained through couriers and a dispatcher: independent lanes, prefetching, the per-step cost that binds next, and the measurements." },
  { "concepts/checks.md" = "Which CRCs mibz2 checks and when, what its errors report, and the inputs it refuses." },
  { "concepts/how-it-works.md" = "mibz2's scanner thread, its workers, and the inverse BWT walked as interleaved chains." },
  { "concepts/prior-work.md" = "The work mibz2 builds on: libbzip2's format and checks, Kärkkäinen, Kempa and Puglisi's interleaved BWT inversion, and lbzip2's and pbzip2's block parallelism." },
]
"Get started" = [
  { "getting-started/installation.md" = "Install mibz2 from PyPI or crates.io." },
  { "getting-started/quickstart.md" = "Decode a .bz2 file with mibz2 from Python and from Rust." },
]
"Optional" = [
  { "blog/index.md" = "What mibz2's experiments are finding, and where they go next." },
  { "blog/2026-11-04-whole-decoder.md" = "A table builder that ran a fifth fewer instructions made the bzip2 decoder 7–19% slower. Counting the whole decoder led to the walk, and to a change that made one thread 2–4% faster. It repeated an experiment our own record already held, with the same result at four workers." },
  { "blog/2026-11-04-autonomous-agent-team.md" = "Each of four agents does one part of the research. A GitHub doorbell lets them hand work to each other directly, without me acting as their message bus." },
  { "blog/2026-11-04-compact30-constructor.md" = "Writing a cheap placeholder for each row, and finishing each 30-row group once, shrank the inner loop. It still builds too slowly." },
  { "blog/2026-11-04-compact30-constructor-notes.md" = "Technical appendix to the post on building a smaller bzip2 decoding table: the BWT's navigation table from first principles, stable counting sort, compact30's row labels, records and RAW groups, epochs and snapshots, finishing a group, RAW canonicalisation, and why fewer instructions needn't mean less time." },
  { "blog/2026-11-02-revisiting-space-time-tradeoff-bwt-inversion.md" = "A packed table saved memory but cost too much to read. A cheaper compact lookup gives the first positive traversal result." },
  { "blog/2026-11-02-memory-level-parallelism.md" = "Interleaving pointer chases lets memory waits overlap. The speedup shows that this pays, but not what limits it: a 2022 exchange about Daniel Lemire's benchmark, read against mibz2's inverse-BWT walk." },
  { "blog/2026-11-02-memory-level-parallelism-notes.md" = "Technical appendix to the memory-level parallelism post: the disagreement about ILP and MLP in detail, the 2022 benchmark, throughput models, Intel counter definitions, a measurement programme for mibz2, a reading list and the source register." },
  { "blog/2026-11-01-inverse-bwt-memory-interference.md" = "Four workers finish decompression sooner, but together spend 32% more processor time per byte. We're testing whether competition for shared memory is responsible." },
  { "blog/2026-11-01-block-dispatch.md" = "How mibz2's parallel decoder hands blocks to its workers, why some take up to a millisecond to be picked up, and how to tell lock contention from scheduling delay." },
  { "blog/2026-10-31-room-walk-overlap.md" = "The decoder's 32-lane walk runs 8.6 times faster than one chain. That figure may not mean what it seems: the walk may already hide memory latency, and spend too many instructions on each byte." },
  { "blog/2026-10-29-compact-navigation-tables.md" = "Most of the inverse BWT's navigation table follows simple patterns: what a census of real blocks found, and what comes next." },
  { "background/history.md" = "Where mibz2 came from: written in wikidata-pq to decode the Wikidata dump, then moved to a repository of its own." },
  { "background/status.md" = "Where mibz2's research stands: the cooperative inverse BWT found, confirmed and explained on a 10-core workstation, and what comes next." },
  { "background/journals.md" = "mibz2's development journals: where they are and what each one records." },
  { "maintainers/development.md" = "The repository's layout, how to build, test and benchmark mibz2, and the commit conventions." },
  { "maintainers/documentation.md" = "How the documentation site and its benchmark pages are built, checked, tested and published to GitHub Pages." },
  { "maintainers/releasing.md" = "How mibz2 is released to crates.io and PyPI at one version: Deploy Release, Tag Release and Release Notes." },
]
"Reference" = [
  { "reference/index.md" = "mibz2's API in Python and in Rust." },
  { "reference/api/mibz2.md" = "The mibz2 Python package: decompress, open, BZ2Reader and DecodeError." },
  { "reference/rust.md" = "The mibz2 Rust crate: decode, decode_parallel, BzReader, StreamDecoder, scan, decode_blocks and Error." },
]
"Start here" = [
  { "index.md" = "A bzip2 decoder built for memory-level parallelism." },
]

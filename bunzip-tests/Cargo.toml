# The native bz2 decoder (../src/bunzip) built on its own, for its tests, its fuzz loop
# and its decode benchmark, with libbzip2 (the bzip2 crate's bundled 1.0.8) as the oracle.
# Not part of the extension: `cargo test --release` here; on aarch64, `cargo test
# --release --target aarch64-unknown-linux-gnu` (under qemu-aarch64 by .cargo/config.toml).
[package]
name = "bunzip-tests"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
name = "bunzip"
path = "../src/bunzip/mod.rs"

[dependencies]
# (the oracle and the test streams' encoder: libbzip2 1.0.8, built from source)
bzip2 = { version = "0.4", features = ["static"] }

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"

[profile.test]
opt-level = 3

# The fuzz loop's: release speed, with overflow checks and debug assertions on, so an
# overflow or a broken invariant is a panic (counted as a failure) rather than wrong bytes
[profile.fuzz]
inherits = "release"
overflow-checks = true
debug-assertions = true

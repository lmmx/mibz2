[package]
edition = "2021"
name = "cells-live"
publish = false
version = "0.0.0"

[workspace]

[dependencies]
mibz2 = { path = ".source" }
serde_json = "1"

[dev-dependencies]
bzip2 = { features = ["static"], version = "0.4" }

[features]
cells-reader = []
default = []
live-trace = ["mibz2/live-diagnostic"]

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"

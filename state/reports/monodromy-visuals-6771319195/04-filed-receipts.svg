<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 675" role="img" aria-labelledby="mv79-04-filed-receipts-title mv79-04-filed-receipts-desc">
<title id="mv79-04-filed-receipts-title">Keep finished work still</title>
<desc id="mv79-04-filed-receipts-desc">The linked-list kernel rehangs a letter card and repairs neighbouring links. The cells kernel files a completed cell in its assigned slots without patching old neighbours; a separate clipboard holds the pending remainder and promised slot. Looking ahead permits prefetch of scattered destinations.</desc>
<text x="20" y="35" class="bf-t-strong" text-anchor="start" style="font-size:26px">Rehang the cards …</text><text x="20" y="72" class="bf-tm" text-anchor="start" style="font-size:24px">Linked lists: the old neighbours change.</text><path d="M35 114H505" fill="none" stroke="var(--bf-muted)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="99" cy="114" r="5" fill="none" stroke="var(--bf-muted)" stroke-width="3"/><path d="M99 120V149" fill="none" stroke="var(--bf-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="50" y="150" width="98" height="67" rx="2" class="bf-card" style="stroke:var(--bf-frame);stroke-width:1"/><path d="M66 157V210" fill="none" stroke="var(--bf-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="105.0" y="192.5" class="bf-t-strong" text-anchor="middle" style="font-size:28px">A</text><circle cx="260" cy="114" r="5" fill="none" stroke="var(--bf-muted)" stroke-width="3"/><path d="M260 120V149" fill="none" stroke="var(--bf-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="211" y="150" width="98" height="67" rx="2" class="bf-card" style="stroke:var(--bf-frame);stroke-width:1"/><path d="M227 157V210" fill="none" stroke="var(--bf-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="266.0" y="192.5" class="bf-t-strong" text-anchor="middle" style="font-size:28px">B</text><circle cx="421" cy="114" r="5" fill="none" stroke="var(--bf-muted)" stroke-width="3"/><path d="M421 120V149" fill="none" stroke="var(--bf-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="372" y="150" width="98" height="67" rx="2" class="bf-card" style="stroke:var(--bf-frame);stroke-width:1"/><path d="M388 157V210" fill="none" stroke="var(--bf-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="427.0" y="192.5" class="bf-t-strong" text-anchor="middle" style="font-size:28px">C</text><path d="M100 240Q260 300 422 240" fill="none" stroke="var(--bf-amber)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="M398 254L422 240" fill="none" stroke="var(--bf-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M416.8 248.6L422 240L412.0 240.3" fill="none" stroke="var(--bf-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M260 147Q337 90 422 147" fill="none" stroke="var(--bf-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="5 6"/><text x="20" y="307" class="bf-t" text-anchor="start" style="font-size:24px">Re-seat a letter; repair 5–6 links.</text><path d="M20 335H520" fill="none" stroke="var(--bf-frame)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="380" class="bf-t-strong" text-anchor="start" style="font-size:26px">… or file a finished receipt</text><path d="M24 460L62 416H259L297 460V563H24Z" fill="var(--bf-green-tint)" stroke="var(--bf-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="48" y="440" width="225" height="67" rx="2" class="bf-card-hi"/><path d="M64 447V500" fill="none" stroke="var(--bf-muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="3 5"/><text x="166.5" y="482.5" class="bf-t-strong" text-anchor="middle" style="font-size:28px">completed cell</text><path d="M24 488H297" fill="none" stroke="var(--bf-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="160" y="547" class="bf-t-strong" text-anchor="middle" style="font-size:26px">stays put</text><rect x="345" y="424" width="167" height="139" rx="3" class="bf-card" style="stroke:var(--bf-frame);stroke-width:1"/><path d="M376 414H481V434H376Z" fill="var(--bf-surface)" stroke="var(--bf-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="429" y="474" class="bf-t" text-anchor="middle" style="font-size:24px">pending</text><text x="429" y="509" class="bf-t" text-anchor="middle" style="font-size:24px">remainder</text><text x="429" y="544" class="bf-t" text-anchor="middle" style="font-size:23px">+ next slot</text><text x="20" y="610" class="bf-t" text-anchor="start" style="font-size:24px">Two cell slots written; no relinking.</text><text x="20" y="648" class="bf-tm" text-anchor="start" style="font-size:24px">Look ahead to future write addresses.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 592" role="img" aria-labelledby="mv79-01-hidden-address-title mv79-01-hidden-address-desc">
<title id="mv79-01-hidden-address-title">The walk is a trail of sealed addresses</title>
<desc id="mv79-01-hidden-address-desc">A sealed envelope for row p must arrive and open before the next address q is available. If p misses in cache, this dependency can expose its memory latency. This is not a claim that every lookup misses.</desc>
<text x="20" y="35" class="bf-t-strong" text-anchor="start" style="font-size:26px">The next address is inside</text><text x="20" y="68" class="bf-tm" text-anchor="start" style="font-size:24px">You cannot order it yet.</text><text x="28" y="116" class="bf-t-strong" text-anchor="start" style="font-size:24px">1  Request this row</text><rect x="38" y="160" width="150" height="86" rx="3" class="bf-card" style="stroke:var(--bf-frame);stroke-width:1"/><path d="M38 160L113.0 206.44L188 160" fill="none" stroke="var(--bf-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="113" y="229" class="bf-t-strong" text-anchor="middle" style="font-size:25px">row p</text><path d="M224 172H292L270 203L292 234H224L246 203Z" fill="none" stroke="var(--bf-amber)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="327" y="186" class="bf-t" text-anchor="start" style="font-size:24px">if it misses,</text><text x="327" y="220" class="bf-t" text-anchor="start" style="font-size:24px">wait for data</text><path d="M112 265L112 313" fill="none" stroke="var(--bf-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M107.2 304.2L112 313L116.8 304.2" fill="none" stroke="var(--bf-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="151" y="295" class="bf-tm" text-anchor="start" style="font-size:24px">The answer arrives.</text><rect x="38" y="371" width="150" height="86" rx="3" class="bf-card-hi"/><path d="M38 371L113.0 331L188 371" fill="none" stroke="var(--bf-green)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="57" y="334" width="112" height="86" rx="2" class="bf-card-hi"/><text x="113" y="364" class="bf-t" text-anchor="middle" style="font-size:23px">byte</text><text x="113" y="400" class="bf-t-strong" text-anchor="middle" style="font-size:23px">next: q</text><path d="M208 405L331 405" fill="none" stroke="var(--bf-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M322.2 409.8L331 405L322.2 400.2" fill="none" stroke="var(--bf-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="356" y="365" width="150" height="86" rx="3" class="bf-card" style="stroke:var(--bf-frame);stroke-width:1"/><path d="M356 365L431.0 411.44L506 365" fill="none" stroke="var(--bf-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="431" y="434" class="bf-t-strong" text-anchor="middle" style="font-size:25px">row q</text><text x="28" y="502" class="bf-t-strong" text-anchor="start" style="font-size:24px">2  Only now is q known</text><path d="M20 529H520" fill="none" stroke="var(--bf-frame)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="568" class="bf-t" text-anchor="start" style="font-size:24px">One chain reveals one address at a time.</text>
</svg>
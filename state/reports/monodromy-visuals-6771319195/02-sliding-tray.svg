<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 600" role="img" aria-labelledby="mv79-02-sliding-tray-title mv79-02-sliding-tray-desc">
<title id="mv79-02-sliding-tray-title">One instruction moves the whole tray</title>
<desc id="mv79-02-sliding-tray-desc">Four equal bytes at rows 10 through 13 map to rows 14 through 17. A tray preserves spacing and order under the common translation +4. The example is illustrative, not a block measurement.</desc>
<text x="20" y="35" class="bf-t-strong" text-anchor="start" style="font-size:26px">Slide the tray. Keep the spacing.</text><text x="20" y="70" class="bf-tm" text-anchor="start" style="font-size:24px">A toy run of four equal bytes</text><path d="M32 123V203H360V123" fill="none" stroke="var(--bf-green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="44" y="135" width="64" height="53" rx="3" class="bf-card-hi"/><text x="76" y="171" class="bf-t-strong" text-anchor="middle" style="font-size:30px">a</text><text x="76" y="239" class="bf-tm" text-anchor="middle" style="font-size:23px">10</text><rect x="122" y="135" width="64" height="53" rx="3" class="bf-card-hi"/><text x="154" y="171" class="bf-t-strong" text-anchor="middle" style="font-size:30px">a</text><text x="154" y="239" class="bf-tm" text-anchor="middle" style="font-size:23px">11</text><rect x="200" y="135" width="64" height="53" rx="3" class="bf-card-hi"/><text x="232" y="171" class="bf-t-strong" text-anchor="middle" style="font-size:30px">a</text><text x="232" y="239" class="bf-tm" text-anchor="middle" style="font-size:23px">12</text><rect x="278" y="135" width="64" height="53" rx="3" class="bf-card-hi"/><text x="310" y="171" class="bf-t-strong" text-anchor="middle" style="font-size:30px">a</text><text x="310" y="239" class="bf-tm" text-anchor="middle" style="font-size:23px">13</text><path d="M128 308V388H456V308" fill="none" stroke="var(--bf-green)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="140" y="320" width="64" height="53" rx="3" class="bf-card-hi"/><text x="172" y="356" class="bf-t-strong" text-anchor="middle" style="font-size:30px">a</text><text x="172" y="424" class="bf-tm" text-anchor="middle" style="font-size:23px">14</text><rect x="218" y="320" width="64" height="53" rx="3" class="bf-card-hi"/><text x="250" y="356" class="bf-t-strong" text-anchor="middle" style="font-size:30px">a</text><text x="250" y="424" class="bf-tm" text-anchor="middle" style="font-size:23px">15</text><rect x="296" y="320" width="64" height="53" rx="3" class="bf-card-hi"/><text x="328" y="356" class="bf-t-strong" text-anchor="middle" style="font-size:30px">a</text><text x="328" y="424" class="bf-tm" text-anchor="middle" style="font-size:23px">16</text><rect x="374" y="320" width="64" height="53" rx="3" class="bf-card-hi"/><text x="406" y="356" class="bf-t-strong" text-anchor="middle" style="font-size:30px">a</text><text x="406" y="424" class="bf-tm" text-anchor="middle" style="font-size:23px">17</text><path d="M118 255L214 292" fill="none" stroke="var(--bf-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M204.1 293.3L214 292L207.5 284.4" fill="none" stroke="var(--bf-green)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="271" class="bf-t-strong" text-anchor="start" style="font-size:24px">all rows +4</text><path d="M20 455H520" fill="none" stroke="var(--bf-frame)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="494" class="bf-t-strong" text-anchor="start" style="font-size:25px">LF(10) = 14      LF(11) = 15</text><text x="20" y="535" class="bf-t" text-anchor="start" style="font-size:24px">One start, one length, one shift.</text><text x="20" y="573" class="bf-t" text-anchor="start" style="font-size:24px">r run intervals describe n row mappings.</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 762" role="img" aria-labelledby="mv79-05-route-planning-title mv79-05-route-planning-desc">
<title id="mv79-05-route-planning-title">The planner is on the clock too</title>
<desc id="mv79-05-route-planning-desc">Two schematic warehouse routes compare a fixed sweep with a schedule that seeks free steps and otherwise the largest cell. Wikidata counts are 1.812 and 1.279 cell steps per run, with a model-specific floor of 1.220. Magnifying glasses show extra choice work. Route geometry and drawn stops are not a numeric scale.</desc>
<text x="20" y="35" class="bf-t-strong" text-anchor="start" style="font-size:26px">A shorter route can take longer</text><text x="20" y="70" class="bf-tm" text-anchor="start" style="font-size:24px">Count the stops. Also price the planning.</text><text x="20" y="119" class="bf-t-strong" text-anchor="start" style="font-size:24px">Fixed sweep</text><text x="20" y="155" class="bf-t-strong" text-anchor="start" style="font-size:30px">1.812 steps / run</text><path d="M40 207H490V259H40V311H490" fill="none" stroke="var(--bf-steel)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90" cy="207" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><circle cx="235" cy="207" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><circle cx="400" cy="207" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><circle cx="445" cy="259" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><circle cx="290" cy="259" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><circle cx="135" cy="259" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><circle cx="90" cy="311" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><circle cx="270" cy="311" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><circle cx="450" cy="311" r="6" fill="var(--bf-surface)" stroke="var(--bf-steel)" stroke-width="3"/><text x="20" y="359" class="bf-tm" text-anchor="start" style="font-size:24px">The next end is already chosen.</text><path d="M20 386H520" fill="none" stroke="var(--bf-frame)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="431" class="bf-t-strong" text-anchor="start" style="font-size:24px">No-new-boundary steps first</text><text x="20" y="469" class="bf-t-strong" text-anchor="start" style="font-size:30px">1.279 steps / run</text><path d="M40 522H240V578H420" fill="none" stroke="var(--bf-green)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><circle cx="70" cy="522" r="6" fill="var(--bf-surface)" stroke="var(--bf-green)" stroke-width="3"/><circle cx="165" cy="522" r="6" fill="var(--bf-surface)" stroke="var(--bf-green)" stroke-width="3"/><circle cx="240" cy="560" r="6" fill="var(--bf-surface)" stroke="var(--bf-green)" stroke-width="3"/><circle cx="330" cy="578" r="6" fill="var(--bf-surface)" stroke="var(--bf-green)" stroke-width="3"/><circle cx="410" cy="578" r="6" fill="var(--bf-surface)" stroke="var(--bf-green)" stroke-width="3"/><circle cx="330" cy="517" r="18" fill="none" stroke="var(--bf-amber)" stroke-width="3"/><path d="M343 530l18 18" fill="none" stroke="var(--bf-amber)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="460" cy="518" r="18" fill="none" stroke="var(--bf-amber)" stroke-width="3"/><path d="M473 531l18 18" fill="none" stroke="var(--bf-amber)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="624" class="bf-tm" text-anchor="start" style="font-size:24px">Finding the next end has a cost.</text><path d="M20 652H520" fill="none" stroke="var(--bf-frame)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="20" y="694" class="bf-t-strong" text-anchor="start" style="font-size:25px">1.220 steps / run: the model’s floor</text><text x="20" y="735" class="bf-t-strong" text-anchor="start" style="font-size:27px">Fewer steps ≠ less elapsed time.</text>
</svg>
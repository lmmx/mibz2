[package]
authors = ["Louis Maddox <louismmx@gmail.com>"]
categories = ["compression"]
description = "A bzip2 decoder built for memory-level parallelism: block-parallel, its inverse BWT walked as interleaved chains, SIMD kernels chosen at run time"
documentation = "https://docs.rs/mibz2"
edition = "2021"
# The published crate: the source, its tests, examples and benches, not the journals, the
# Python package (maturin adds python/ to the sdist itself) or the repository's tooling
exclude = [
  ".github/",
  ".just/",
  ".pre-commit-config.yaml",
  "Justfile",
  "bench/",
  "docs/",
  "pyproject.toml",
  "python/",
  "release-plz.toml",
  "rust-toolchain.toml",
  "taplo.toml",
]
homepage = "https://lmmx.github.io/mibz2/"
keywords = ["bwt", "bz2", "bzip2", "decompression"]
license = "MIT OR Apache-2.0"
name = "mibz2"
readme = "README.md"
repository = "https://github.com/lmmx/mibz2"
rust-version = "1.80"
version = "0.5.14"

[lib]
crate-type = ["cdylib", "rlib"]
name = "mibz2"

# The library depends on std only. PyO3 is for the Python extension module (the `python`
# feature, built by maturin: see pyproject.toml)
[dependencies]
pyo3 = { features = ["abi3-py310"], optional = true, version = "0.29" }

# Every non-default feature but `python` is research: off by default, and without it the
# decoder compiles exactly as shipped. Each carries a retention note: what it serves, and when
# it can go. They are reviewed at each release (docs/RELEASING.md §3); one whose reason has
# lapsed is removed in its own PR (#145, LOG 6893084445).
[features]
default = []
# The Python bindings (pyproject.toml's maturin build): shipped, not research
python = ["dep:pyo3"]
# The parallel decoder's timeline (src/trace.rs), for examples/occupancy.rs (#39): the
# bench-team-size, bench-team-pipeline and bench-pipeline-levers recipes, bench/corpus.sh
# and CI's occupancy workflow. Retain while those recipes run; remove with the last of them
trace = []
# The memory-lever experiment's two opt-in Cells kernels (src/cells_lever.rs: lazy letters,
# and rules staged and stored past the cache), for examples/ab.rs's `mibz2-workers-w-lazy` and
# `mibz2-workers-w-nt` arms and the bench-memory-lever recipe (#145 QUEUED 6901989466). Never a
# default. Retain until that run is read; then remove, or promote an arm under its own
# registration
memory-lever = []
# The cooperative waits' counts (coop::wait_stats), for examples/wait_audit.rs, the spin
# audit (docs/journal/2026-11-09-spin-audit/). Retain while the cooperative teams' waits are
# tuned; remove when the coop wait sites are no longer changed, or with the teams
wait-stats = []
# The walks' per-call records (coop::walk_stats), for the team screen's probes and the native
# engagement diagnostic (docs/journal/2026-11-10-staged-engagement-diagnostic-draft.md), and
# CI's walk-stats workflow. Retain while the cooperative walks are being changed; remove with
# that workflow once those diagnostics are closed
walk-stats = []
# Research: the Cells memory-dose scratch (src/dose.rs; #145, LOG 6879466310), built by
# bench-cells-dose and bench-cells-imc (at MIBZ2_DOSE_MB=0, its dose_blocks counter checks
# Cells engaged). Retain while either recipe may be re-run; remove with both
dose = []
# Research: per-phase software counts (task clock, page faults) of Cells' induction and
# writer per worker (src/phase.rs), from the phase attribution (#145, LOG 6884716103),
# trimmed to the scopes and the software pass (LOG 6893084445). Retain while a Cells phase
# study is open; remove at the first release review with none
phase-counters = []
# Research: the shipped lazy Cells kernel's induction recorded block by block, steps and
# words, checked against a safe replay and the kernel's output (src/itrace.rs,
# examples/induction_trace.rs; #145, QUEUED 6915302968), for MONODROMY's Beyond Rauzy–Veech
# programme. Retain while that programme reads induction records; remove at the first release
# review after it closes
induction-trace = []
# Research: the second ChatGPT relay's grammar replay harness (src/cells_replay.rs,
# examples/grammar_replay.rs; #145, LOG 6924013198): each lazy block's grammar written by the
# shipped writer and by 12-byte and 8-byte rule writers, timed and checked, with the tables'
# fit and the tiny-word and common-child censuses. Retain while the relay's compact-rule
# questions are open; remove at the first release review after they close
grammar-replay = []
# research only: the one-scan writer's prototype beside the shipped writer, compared block by block
owned-writer = []
# Research only: the moonshot scorer's candidate interface (bench/moonshot/): a block's run
# records readable by a kernel built outside the crate (`Runs::records`, public with it).
# Changes that visibility and nothing else; never on a production path. Retain while the
# scorer is in use
moonshot = []
# Research only: the census of the open kernel's blocks' structure (src/census.rs,
# examples/census.rs; docs/journal/2026-11-24-wikidata-block-census.md, #145 LOG 7126445058):
# each block the open kernel takes gets one record of its retained rows, runs, strips and the
# retained map's cycles and locality, from an O(n) pass beside the kernel. Never on a
# production path. Retain while the census's features are in use; remove at the first release
# review after
census = []
# Research only: the open kernel's emitter handed the block's own dictionary word codes in
# marked-cycle output order, read sequentially from the front and back (src/supplied_codes.rs,
# src/open/supplied.rs), against the emitter as shipped that walks the retained cycle, for
# examples/supplied_codes.rs and the bench-supplied-codes diagnostic
# (docs/journal/2026-11-24-supplied-codes-registration.md). Five clock reads and a record per
# open block; in its `open` mode the kernel is as shipped. Never on a production path. Retain
# until that run is read; then remove
supplied-codes = []
# Research only: the parallel decoder's scanner recorded (each block's symbols, an oracle pass
# outside the clock) or replayed (those symbols delivered through the production job queue in
# place of the scanner's reading) (src/scan_oracle.rs, the hooks in src/parallel.rs), with
# supplied-codes' emission switch, for examples/four_arm.rs and the bench-four-arm diagnostic
# (docs/journal/2026-11-24-four-arm-registration.md). In its `scan` mode the scanner is as
# shipped. Never on a production path. Retain until that run is read; then remove
scan-oracle = ["supplied-codes"]
# Research only: the decoder's character across 1 to 20 workers, as a network of activities,
# buffers and resources (src/character.rs, examples/character.rs; docs/journal/
# 2026-11-24-algorithm-level/briefs/character.md, stage 1: bench-character): each thread's
# ledger of activities (A0 to A10), waits and blocks, and the buffers' live occupancy. Off,
# each hook is one relaxed atomic load. Never on a production path. Retain while the
# character study's stages run; remove at the first release review after
character = []
# Research only: the ideal-parts matrix's construction oracle (C, target T2;
# src/ideal/construction.rs, hook in src/open.rs): records each Open block's built structures
# outside the clock and replays them straight to emission (MTF/RLE2 still runs). Never on a
# production path. Retain until the ideal-parts matrix is analysed; then remove
ideal-construction = []
# Research only: the ideal-parts matrix's MTF/RLE2 oracle (M, target T3; src/ideal/mtf.rs,
# hook in src/lib.rs): records each block's L (run records or column) outside the clock and
# replays it straight to construction, skipping MTF/RLE2. Never on a production path. Retain
# until the ideal-parts matrix is analysed; then remove
ideal-mtf = []
# Research only: the ideal-parts matrix's RLE1, CRC and output oracle (R, target T6;
# src/ideal/rle1.rs, hook in src/lib.rs): records each block's final decoded bytes outside
# the clock and replays them to the in-order reader, skipping RLE1 expansion and the block
# CRC while emission still runs. Never on a production path. Retain until the ideal-parts
# matrix is analysed; then remove
ideal-rle1 = []
# Research only: the ideal-parts matrix's delivery reader mode (D; src/ideal/delivery.rs,
# hook in src/parallel.rs): takes each decoded block in order and discards it without copying
# to the caller, measuring the in-order reader and copy cost. Never on a production path.
# Retain until the ideal-parts matrix is analysed; then remove
ideal-delivery = []
# Research only: the pooled scan (docs/journal/2026-11-24-algorithm-level/pooled-scan/
# registration.md, plan.md thread 3): no scanner thread reading symbols; the feeder's chain
# thread finds the block magics and the workers read and decode each candidate's block end to
# end, the chain accepting a worker's block only where the sequential scanner would have read
# the same item (src/pooled_scan.rs, src/parallel/pooled.rs). Off, and with its mode unset,
# the decoder is as shipped. Never on a production path. Retain until its kill test is read
pooled-scan = []

[dev-dependencies]
# The oracle and the test streams' encoder: libbzip2 1.0.8, built from its bundled source
bzip2 = { features = ["static"], version = "0.4" }
# The A/B harness's comparison only (examples/ab.rs): pbz2 0.2.0 (Soof Golan, MIT), never
# a dependency of the library
pbz2 = { default-features = false, features = ["simd"], version = "=0.2.0" }

[[bench]]
harness = false
name = "decode"

[profile.release]
codegen-units = 1
debug = "line-tables-only"
lto = "fat"

[profile.bench]
codegen-units = 1
lto = "fat"

[profile.test]
opt-level = 3

# The fuzz loop's (examples/fuzz.rs): release speed, with overflow checks and debug
# assertions on, so an overflow or a broken invariant is a panic (counted as a failure)
# rather than wrong bytes
[profile.fuzz]
debug-assertions = true
inherits = "release"
overflow-checks = true

# examples/ab.rs's arms built by bench/alternatives only (its build.rs sets the cfg)
[lints.rust]
unexpected_cfgs = { check-cfg = ["cfg(mibz2_alternatives)"], level = "warn" }

# bench-supplied-codes' harness needs the supplied-codes switch and records
[[example]]
name = "supplied_codes"
required-features = ["supplied-codes"]

# bench-four-arm's harness needs the scanner's replay and the emission switch
[[example]]
name = "four_arm"
required-features = ["scan-oracle"]

# The block census needs its recorder
[[example]]
name = "census"
required-features = ["census"]

# The occupancy instrument (#39) needs the decoder's timeline
[[example]]
name = "occupancy"
required-features = ["trace"]

[[example]]
name = "wait_audit"
required-features = ["wait-stats"]

[[example]]
name = "induction_trace"
required-features = ["induction-trace"]

[[example]]
name = "grammar_replay"
required-features = ["grammar-replay"]

[[example]]
name = "writer_owned"
required-features = ["owned-writer"]

[[example]]
name = "lever_counts"
required-features = ["memory-lever"]

[[example]]
name = "character"
required-features = ["character"]

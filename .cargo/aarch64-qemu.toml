# The aarch64 tests under qemu, on an x86-64 machine with aarch64-linux-gnu-gcc and
# qemu-user installed: cargo test --config .cargo/aarch64-qemu.toml --target
# aarch64-unknown-linux-gnu. Not the default config, so that native builds (and maturin's
# cross builds) keep their own linker
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
runner = "qemu-aarch64 -L /usr/aarch64-linux-gnu"

- Proving K=4, S=16, SLAB=32 KiB unified inline16 is the x86-64 local optimum (#1068, #1076, STOP): direct-literal split regressed 24/24 cells (+4.1%..+39.0%); K=6,8,10 hit the 15-GPR register-file wall (+10.8%..+45.4% in A6c+7+9); decoupled batch-chase broke OoO overlap (+56.0 ms even at K=4);
- Safe-Rust serial header parsing (#1069, #1074, PASS): A2b_direct_runs, A2c_lut_multi, and A2d_direct cut standalone A2a..d -31.6%..-37.7% and full S' -4.44%..-7.38% (modeled S' ~ 134-139 ms), flipping k=8 from scanner-bound to worker-bound and shifting slack-only hybrid value to k=9-10;
- Whole-decoder Intel JCC-32B branch alignment audit (#1077): 1,746 -> 0 unfused crossings (+3.4% .text), 12/12 off-Wikidata faster, OpenCells -13.7%..-15.6% disjoint on VM Xeon silicon, with explicit silicon distinction vs Comet Lake-S stepping 5 and AMD Zen;
- Disciplined off-path stops (#1060 column MTF RLE2 branch floor; #1063 Cooperative Amdahl cap).

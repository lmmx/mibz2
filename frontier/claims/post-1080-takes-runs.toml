1. 100% byte-identical and error-identical output on `cargo test`, `fuzz-smoke`, Miri on `src/runs.rs`, and all 14 corpora (658/658 blocks) of `examples/takes_runs_probe.rs` (0 new `unsafe`).
2. Steal-free paired MTF+inverse-BWT CPU (`takes_runs_probe --rules-only --reps 5`) cuts `mdjournal` >= 10.0% AND `elf` >= 10.0% disjointly FASTER across baseline x86-64, `-C target-cpu=native`, and JCC-32B-aligned builds, with 0 disjoint regressions across all 14 corpora and 0 route changes on `wikidata`, `text`, `random`, `records`, `runs`, `onebyte`, and `pattern`.

question = """
`src/runs.rs:78` rejects the run-records path (`runs::front + Segmented::invert_runs`) whenever `2 * syms.len() > max_len` (`syms_ratio > 0.50`), a cut fitted in `2026-11-10` before #1080 (`build_lf` and `fill_avx2_trusted`). Across 14 corpora (658 blocks, 100% byte+CRC exact), compressible markdown (`mdjournal`, 10/10 Column blocks, `syms_ratio = 0.51-0.63`, `run_frac = 31-35%`), ELF binaries (`elf`, 25/26 Column blocks, `syms_ratio = 0.52-0.74`, `run_frac = 23-31%`), and boundary `prose`/`pysrc`/`json` blocks (`syms_ratio = 0.505-0.70`) suffer severe `s <= 1 / run != 0` RLE2 branch mispredictions in `mtf::mtf_avx2` (~90% of the gap) plus slower `build_lf` (~10%).

Does widening `takes_runs_slice` in `src/runs.rs:78` from `2 * len > max_len` to `4 * len > 3 * max_len` (keeping `RUN_SHARE = 32` unchanged, so `random`/`records` still short-circuit in O(1) without sampling) cut MTF+inverse-BWT CPU by double digits on `mdjournal`/`elf`/`json` with zero regression on `wikidata`, `text`, `random`, `records`, `runs`, `onebyte`, and `pattern`?
"""
why = """
A 1-line safe-Rust constant change in `src/runs.rs:78` (0 new `unsafe`, 0 blocks changed on `wikidata`/`text`/`random`/`records`/`runs`/`onebyte`/`pattern`) cuts steal-free MTF+inv CPU by -24.1% base / -32.4% native / -13.2% JCC-32B on `mdjournal`, -15.5% / -24.7% / -14.5% on `elf`, and -9.0%..-9.9% on `json` (all disjoint FASTER across all 3 builds), plus -4.3%..-8.4% on `prose` and -3.8%..-6.2% on `pysrc`, stacking cleanly with `post-1080-open-admission`.
"""

question = """
In `#1305` (`docs/notebook/2026-11-28-explore-composed-worker-stack.md`), `A5+A6a` (`src/runs/fold.rs` + `FoldSink` + `OutQ16<1008,1024>`) is `30.0%` (`jcc`) / `31.1%` (`base`) of residual `B4` worker CPU. Dissection in `docs/notebook/2026-11-28-explore-fold-a5a6a-dissection.md` (`4,893 / 4,893` exact parity checks across all 233 Wikidata Open blocks on `base`, `jcc`, and `native`, `0 B` extra heap) proved that combining four surgical changes cuts `A5+A6a` by **`-12.28%` `base` / `-12.62%` `jcc` / `-21.94%` `native`** warm (`-8.93% / -9.16% / -14.62%` L3-cold):
1. Port `#1274`'s i9-passing 64-symbol `u64 vptest` Pass 1 (zero `vmax`, 2 trailing zero words, O(1) `s2u_injective`) into `src/runs/fold.rs::build_bitmaps_avx2` (`-11.3%..-13.6%` isolated Pass 1, `363 -> 241` insns, `vzu 4 -> 1`);
2. Return `(cnt, batch_rows)` from `fill_batch_avx2` in its existing single-copy MTF loop (`+1..+3` insns, zero `spw` spills, `0` `vzeroupper`/`0` `ymm`);
3. In `#![forbid(unsafe_code)]` `src/open/outq.rs` + `src/open.rs`, split-borrow `out` and packed 8-byte `Slot8 { cur, end }` from cold `OutQMeta` (hoisting `out.ptr`/`out.len` out of the 14.39M-run thin loop), hoist `NO_MARK = p.wrapping_sub(pos) >= batch_rows` once per 512 runs, and outline `#[cold] push_strip` (shrinking `flush_batch` `-66.4%..-71.8%` insns and `-77.5%` stack loads, `0` `vzeroupper` in the thin loop and `push_slow`);
4. Accelerate `bitmap_within_dense_cap` with `#[target_feature(enable = "bmi1,bmi2,lzcnt")]` + inner `while w != 0` + `_bzhi_u64` (`-38.4%..-41.3%` on Wikidata's 31 dense-band blocks, `0` stack stores, `0` `vzeroupper`).

Does porting this `F8` stack into `src/runs/fold.rs`, `src/open.rs`, and `src/open/outq.rs` (sequenced after `mtf-fold-streaming-admission`) cut `wikidata` `1W` `OpenCells` worker CPU by `>= 3.0%` on both `base` and `jcc` (`>= 4.0%` `native`) with `0 B` RSS growth, `0` `vzeroupper`/`0` `ymm` in `fill_batch_avx2` and `push_slow`, Miri `0` UB, and zero guard regressions across all 6 guard corpora?
"""

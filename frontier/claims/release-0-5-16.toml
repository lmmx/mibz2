Release mibz2 0.5.16 by docs/RELEASING.md, step by step. Two software commits have merged to master since v0.5.15 (git log --first-parent v0.5.15..origin/master -- src python Cargo.toml Cargo.lock pyproject.toml build.rs), each accepted under its own PR's rule:

needs_louis = ""
question = """
Post-#1080 (`Segmented` -15.4%..-18.5%), the `OpenCells` vs `Segmented` crossover across 9 real-world corpora moved to `m/n ≈ 0.18-0.20` shipped (`~0.22-0.25` under `#1053+#1110`), leaving three compounding leaks on `master`:
1. `OpenLow` (`r/n < 0.15`) has no `m/n` guard, admitting primary `text` blocks with `r/n = 0.142-0.146` but `m/n = 0.419-0.423` (`2.06-2.14x` slower on `Open`) and `prose` blocks with `m/n = 0.32-0.34` (`1.62-1.96x` slower);
2. All 67 dense-band blocks (`0.15 <= r/n < 0.28`) across all 9 corpora lose to post-#1080 `Segmented` (67/67 base, 65/67 JCC-32B);
3. 58 refused dense-band blocks (`text` 18, `rustsrc` 12, `logs` 10, `prose` 5, `elf` 5, `json` 4) pay `~0.4-0.5 ms/blk` scanning `within_cap` only to be refused 100%.

Does replacing `OpenCellsOf::cap` in `src/open.rs` with the zero-extra-memory two-tier rule (`1/64 <= r/n < 0.10` outright `Cap::NONE`; `0.10 <= r/n < 0.15` `within_cap(m <= min(256_000, 0.22*n), strips <= 16_384)`; `r/n >= 0.15` straight to `Segmented` — optionally comparing O(1) `thin_rows` tracking in `runs::front` if `src/runs.rs` is unheld) recover double-digit worker CPU on primary `text` and off-Wikidata corpora with zero Wikidata regression?
"""
why = """
Primary corpus `text` recovers -12.9%..-20.2% MTF+inverse-BWT CPU (-10.6%..-13.0% even under `#1053+#1110`), and off-Wikidata `prose`/`rustsrc`/`logs`/`json` recover -6.1%..-16.8% (up to -27.1% with O(1) `thin_rows`), with -1.2%..-3.7% faster Wikidata and zero regressions across 18/18 base+JCC-32B cells — in ~10 lines of 100% safe Rust with zero extra memory.
"""
stop_test = """
Frozen before data:
1. 100% byte-identical and error-identical output on `cargo test`, `fuzz-smoke`, Miri on `src/open.rs`, and all 9 corpora of `examples/route_crossover_probe.rs` (0 new `unsafe`).
2. Steal-free paired MTF+inverse-BWT CPU (`route_crossover_probe --eval-rules`, >= 5 rotated interleaved repeats, CPU-calibrated inner passes >= 240 ms/sample) recovers >= 5.0% on primary `text` AND >= 5.0% on >= 2 of {`prose`, `rustsrc`, `logs`, `json`} disjointly on BOTH baseline x86-64 and JCC-32B-aligned builds, with `wikidata` <= +0.5% (no regression) and 0 disjoint regressions across all 9 corpora.
3. Exact-head CI paired `ab` bench passes `PERFORMANCE-POLICY.md` §2 across all 7 CI corpora (`wikidata`, `text`, `onebyte`, `pattern`, `random`, `records`, `runs`) at 1T/2T/4T (expecting a visible win on primary `text` and flat/faster on `wikidata`).
4. If `wikidata` regresses > +0.5% on 1T/4T CI or any corpus regresses disjointly under #1053+#1110, STOP or narrow threshold (`0.22` vs `0.25`) before merge; never relax thresholds post-data.
"""
done_when = """
A merged PR on `src/open.rs` (and unit tests in `src/open/dense.rs`) passing (1)-(3) on exact-head CI, with a delta.
"""

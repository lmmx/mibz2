question = """
`hold/crc32-avx2-ring-barrett-build` is `phase = "parked"` for PR #1179 with `pr_head = af34b183`, but #1179's branch was rebased to 8cb68208 after the handoff. A parked lease is live regardless of expiry (`live()`), and it is released only by `finish_review` / `reconcile_integrations`, which require `lease.pr_head == PR head`. The claim is `dropped` on master, yet its reservation on `src/crc.rs` can never be released, so its admitted successor `crc32-avx2-ring-rescue` (P2) cannot be claimed (`claim` exits "would share ... held by claude-code"). Fix: when the claim is `dropped` or `done` on origin/master and the PR is closed unmerged, identify the reservation by claim + PR number rather than the stale head, in `finish_review(cancelled=True)` and in reconciliation. Leave the merged path and undropped claims exactly as they are.

Second stranding mode (twenty-second synthesis pass, docs/notebook/2026-11-28-synthesis-twenty-second-pass.md section 3): `hold/segmented-fused-postwalk` is `phase = "parked"` for PR #1183 with `pr_head = e12e0aa1`, the PR head is now 3c80d181, the claim is still `open` on master, and the PR-head card says `status = "blocked"`. So `take-review` refuses ("has not declared this claim ready for handoff") and no terminal path exists. It holds src/bwt.rs, src/rle.rs and src/lib.rs. The same claim + PR-number release must cover this case once the claim is terminal on master (blocked or dropped) and the PR is closed unmerged; a fix that keys only on `dropped` leaves it stranded. The stop_test is frozen and unchanged; a taker should add a regression fixture for this second mode alongside (1), since (1) alone would not exercise it.
"""
why = """
Recovers stranded capacity: a striated path held forever by a dropped claim blocks every successor on it (P1, shared obstruction). Without it the only exits are rewriting someone else's branch or hand-writing a lease, both barred.
"""
stop_test = """
Frozen before code: (1) a regression test reproduces the stuck lease (parked, head moved, PR closed unmerged) and shows it retained while the claim is live and released with terminal `closed-unmerged` once the claim is dropped on master; (2) a merged-path finish with a moved head is still refused; (3) the full `tests/test_frontier.py` suite passes. Independent review by a different agent (lease-enforcement change).
"""
done_when = """
Merged after independent review; #1179 closed unmerged as superseded by the rescue; the parked hold released by reconciliation.
"""

question = """
`docs/journal/2026-11-27-explore/eager-cells-and-seq-open-dissection.md` (#1194) STOPped an immediate switch of `t = 1, 2` from `Seq(Cells)` / `EagerCells` to `OpenCells` on current master: at `t = 1` on baseline x86-64, warm wikidata `Seq(OpenCells)` is +12.1% and `Seq(OpenR2Cells)` +9.2% [+2.4%, +16.5%] slower, matching the i9 `k = 1` ratio (1.123x, `bce3914d`).

The same probe built with `--features forward-anchor-lanes` (#1110) flips every low thread count: OpenCells beats Cells at `t = 1, 2, 3` by -2.0% / -5.0% / -10.9% (base) and -9.1% / -14.4% / -13.7% (JCC-32B), at 0.44-0.61x peak RSS, 63/63 SHA-256 exact against libbzip2.

Once the four-lane forward walk is the default on master, does routing `t = 1..3` onto OpenCells (and retiring `EagerCells` / `Seq(Cells)`) win on the i9 at `k = 1, 2, 3` without regressing any corpus?
"""
why = """
Removes a whole engine (5,154 LOC across 11 `src/cells*.rs` files unreachable from default paths, plus its 8.6 MiB/worker `Segmented` fallback on wikidata) while cutting `wikidata` 1T..3T CPU by 18.8%..28.9% on `#1312` bounded slabs alone (28.9%..34.2% composed with `#1328` + `default-a5a6a-fast` + `#1311`, zero guard regressions across 21 cells) at 0.48-0.56x peak RSS. Blocked until the bounded 80 KiB four-lane walk ships (`#1324`); do not admit to open before then.
"""
stop_test = """
To be frozen before data when admitted. Draft: on the i9 at k = 1, 2, 3 (just submit), OpenCells with forward emission no slower than the shipped route on wikidata and text (95% CI), no secondary corpus > 2% slower, peak RSS <= 1.0x; byte- and error-identical on cargo test, fuzz-smoke and all 7 corpora. Otherwise STOP with a scoped dead-end row.
"""
done_when = """

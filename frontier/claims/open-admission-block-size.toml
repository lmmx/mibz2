id = "open-admission-block-size"
title = "Make the open kernel's admission depend on block size, so bzip2 -1..-3 blocks take Segmented where it is faster"
kind = "build"
zone = "striated"
needs = ["shell", "rust"]
priority = 3
status = "dropped"
owned_paths = ["src/open.rs"]
mechanisms = ["block-size-aware-open-admission"]
needs_louis = ""
question = """
`OpenCellsOf::cap` (src/open.rs) admits on r/n alone, with thresholds priced on 900k-row blocks. The same wikidata text re-encoded by bzip2 1.0.8 at -1..-9 shows, on a 4-vCPU VM with 2 MiB L2 a core, production's inverse over `Segmented`'s on the same blocks at 1.17-1.20 (-1, 100k rows), 1.06-1.09 (-2), 0.98-1.02 (-3), 0.71-0.76 (-5) and 0.48-0.51 (-9), independent of timing order. Within a fixed r/n bin the ratio is flat from 100k to 300k rows and drops between 300k and 500k, where `Segmented`'s row vector passes L2 (docs/notebook/2026-11-28-explore-block-size-route.md). Does an n-dependent outright threshold (for example, below a row count N0, Open only when r/n < t0, else `Segmented`), with N0 and t0 fitted on CI's runner and the i9 rather than this VM, recover the inverse's loss on small-block files without changing the route of any 900k block?
"""
why = """
Every route figure in the frontier prices 900k blocks. Small-block files (bzip2 -1..-3, and tools that pick a low level for speed) take Open everywhere and lose to the fallback that the same worker already holds. On the VM the oracle is -19% of the -1 inverse and -13% at -2, and a two-parameter rule gets -17% and -9%. On the whole -1 file, `Segmented` alone already beats production by 6-19%. It is a cold-path change in `cap`, with no new kernel and no change for wikidata -9. The crossover is a cache property, so the machines it ships on have to set it.

28 Nov 2026 (Step 1 physical i9 calibration, `origin/evidence 7f03816b`, `#1374`): STOP — on the physical i9-10900K (256 KiB L2, 20 MiB L3), no `<400k` row-count bin reached pooled `Open/Seg >= 1.05` (max `1.0321` on `text -1`, matching `text -9` `1.0359`; `wikidata -1` = `1.0149`, `-2` = `0.8795`, `-3` = `0.8457`), and the 2D `(row_bin x r/n_bin)` grid is flat across `100k..900k` rows inside every `r/n` band. Scoped STOP row recorded in `frontier/dead-ends.tsv` (`docs/notebook/2026-11-28-block-size-route-i9-verdict.md`).
"""
stop_test = """
Frozen before data:
1. Calibrate first on CI's runner, or the i9 under standing workstation authority if a frozen recipe exists: per-block Open vs `Segmented` (examples/route_census, ROUTE_FULL=90000, ROUTE_SHADOW=1 and =first) on wikidata re-encoded at -1, -2, -3, -5 and -9, plus the route census's text panel at -1 and -9. If no row-count bin below 400k rows shows Open/Seg >= 1.05 on that machine (pooled over both orders), STOP with a scoped dead-end row: the effect is this VM's L2, not the shipped targets'.
2. Otherwise, choose N0 and t0 from step 1's data and freeze them in the PR. The decoder output must be byte-, CRC- and error-identical (cargo test, fuzz-smoke, every route-census corpus). No block of 900,000 rows or more changes route (unit test on `cap`).
3. Paired A/B, at least 9 interleaved rounds. PASS if the -1 re-encoding's 1T wall improves >= 5% and the -2's >= 2% (median ratio, 95% CI excluding 0), and wikidata -9 and the CI corpora move by no more than +/-1% at 1T and 4T. Peak RSS at 8 workers is within 1.02x on the -1 file. Otherwise STOP with a scoped dead-end row.
"""
done_when = """
A PR on src/open.rs passing (2) and (3), with a delta; or a STOP row from (1) or (3).
"""

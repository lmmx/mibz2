Construction plus emission is the largest worker-side budget (1,068 ms of the 1,306 ms stage-1 one-worker reference). The prior order census's 2.65% conditional floor and LIMIT oracle's 2.78%/1.45% ceiling constrain narrow families, not all representations. Existing non-walk/tunnel results and the measured forward control must be reused rather than rediscovered. A new representation may reduce wiring, traversal and spelling together; actual 8-worker gains still require scanner relief. The owner's question is to separate ideal structure value from how to compute it, as the ideal-parts matrix separated stage budgets.
"""

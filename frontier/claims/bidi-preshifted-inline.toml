question = """
spelling-census (#951) showed that pre-storing right-aligned back-side 16 B inline words (`inline_back`) in A6b recovers 26.3-26.8% of decoupled `E_consume` (`0.732-0.737x`, ~61-66 ms on #952's warm-cache ~230-245 ms i9 baseline) on 232/233 Wikidata blocks without leaving bidirectional traversal or changing A6c wiring.
However, #951 measured `bidi_pre_shifted` only on decoupled `E_consume` (without `edges[]` pointer chasing). Inside full `emit_bidirectional`, random edge-walk load latency may partially overlap the `u128 << 8*(16 - lb)` shift ALU cost, and doubling the inline table (~18 KiB -> ~35 KiB median) may affect L1d behavior when `edges[]` is live.
Measure `bidi_pre_shifted` end-to-end inside a full `A6b + emit_bidirectional` mirror (`examples/`) on `wikidata`, `wikidata x4`, and `ab gen` corpora (at least 5 interleaved repeats, byte-identical to `bwt::walk`).
"""
why = """
If the saving survives inside full `emit_bidirectional`, it yields ~4-5% of 1-worker wall (~61-66 ms) with a minimal, low-risk dictionary table addition while the larger `forward-emission` rewrite is designed and built.
"""

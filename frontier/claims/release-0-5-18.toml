question = """
Release mibz2 0.5.18 by docs/RELEASING.md, step by step. One software commit has merged to master since v0.5.17 (git log --first-parent v0.5.17..origin/master -- src python Cargo.toml Cargo.lock pyproject.toml build.rs), accepted under its own PR's rule:
- #1234 default-path OpenCells output queue: QueuesOf::push_slow capped to a straight-line 4-rank unroll per outer step (safe code), removing all 11 vzeroupper and 56 ymm instructions it compiled to under -C target-cpu=native and JCC-aligned native builds; baseline x86-64 builds were already clean. The experimental mtf-fold measurement in the same PR stopped at its guard-corpus gate (off by default).
RELEASING section 5c does not apply: the change does not alter a worker's admission, work per block, working set, scratch layout or DRAM traffic, only native-target instruction selection in one slow path. Section 5a's crossover runs anyway (src/open on the workers path changed).

Candidate as of 28 November (twenty-fifth synthesis pass): master now also carries #1246, #1117, #1268, #1294, #1274 and #1312 (feature-gated). #1246 skips a pre-scan with routes unchanged and #1274 changes runs::front on the default path; both change a worker's work per block, which section 5c names, so the "5c does not apply" reasoning above covers #1234 only and must be reassessed before pinning.
"""
why = """
P1 by rule: a release is P1 once recognised. Users building with -C target-cpu=native get an OpenCells output queue free of AVX-SSE transition penalties.
"""

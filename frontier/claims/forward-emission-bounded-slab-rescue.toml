question = """
Physical i9-10900K C6 adoption run `origin/evidence ccfa473f` (`forward-adopt/run-20261128T020039Z.tar.gz`, SHA-256 `2514bb60...`, `docs/notebook/2026-11-28-forward-emission-adopt-i9-verdict.md`) proved the `#![forbid(unsafe_code)]` disjoint-slab four-lane forward walk (`#1110` + `#1217`) wins massively on wall/CPU with 12/12 guards clean (`wikidata/1` `-15.38%`, `wikidata/6` `-13.52%`, `wikidata/8` med `-4.47%` / CPU `-7.8%`, `wikidata/10` `-3.51%`, all 12 guard cells `0.9899–1.0143x` wall and `0.9965–1.0022x` RSS), but failed C6 adoption (`DO NOT ADOPT`, C2 preserved) on one clear root cause: `Arena::pool` + `Arena::used` retains an unbounded pool of `~32 × 32 KiB` slabs (`~0.84–1.0 MiB/worker`) on top of `out`, driving peak RSS to `+1.72 MiB` (`1.0541x`) at 1W and `+6.71–6.94 MiB` (`1.1049–1.1081x`) at 8–12W (exceeding both the `1.080x` gate and `PERFORMANCE-POLICY.md` §2's `10%` ceiling).

Can we eliminate the retained per-worker slab pool and full-block double buffering in `#![forbid(unsafe_code)]` (keeping active worker slab scratch `<= 4 × 32 KiB = 128 KiB/worker` via bounded-slab / direct-to-`out` or streaming RLE1+CRC32 emission) so `forward-anchor-lanes` holds peak RSS `<= 1.020x` at 1W and `<= 1.030x` at 6/8/10/12W on i9 while preserving or improving its `-15%` 1W / `-13%` 6W / `-4..5%` 8–10W Wikidata speedup and 12/12 guard parity?
"""
why = """
Research persistence on the single largest ready-to-ship software speedup in the repository (`-15.4%` 1W, `-13.5%` 6W, `-7.8%` 8W CPU, `-3.5%` 10W, 12/12 guards clean, zero `unsafe`). Fixing the `Arena::pool` double-buffer RSS tax directly removes the only structural blocker to default adoption in `v0.5.18` (and eliminates `+6.7 MiB` of 8-worker L3 pressure inside the 20 MiB L3 budget).
"""

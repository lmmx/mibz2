Round 1 (rauzy-census/results) killed the induction order: a 1.41% ceiling. Round 1 priced the induction's cost, not its product. The induction builds the words that emission spells (298 ms at 1 worker), so the machinery's budget is about 110 ms of steps, 64 ms of dictionary and 298 ms of spelling: roughly a third of the 1-worker wall.
1. Sweep the thin/thick limit (LIMIT 8, 12, 16, 24, 32, 64, then per-block or per-byte from A6a's counts). Measure A6a + A6b + A6c + A7 + spelling together: fewer, longer words against more induction.

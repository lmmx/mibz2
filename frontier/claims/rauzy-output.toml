3. Separately, cheaper steps: are the 24.6 ns per step a dependent-load chain? Measure it, then try prefetch or interleaving, minding the i9's 256 KB L2.
A free-steps-only bitmap rule is excluded: round 1's 1.41% ceiling caps it below the gate.
"""

question = """
PR #1179's no-prefetch AVX2 ring + zero-table Barrett CRC-32 is exact and B5-sound, and cuts isolated CRC by 17-18% on Intel (CRC stage 0.52 -> 0.29 c/B). It STOPPED on its frozen whole-decoder gate only because CI's peak RSS moved +0.9..+2.2% on five cells, against a <=1.005x point bound. The code allocates nothing on the heap, and the same run moved other cells by -2.6%. CI's Zen 4 shows the CRC stage at -0.6%, so it cannot see the gain. Does the same kernel, rebased, with `# Safety` sections on its three `unsafe fn` entry points, show a paid whole-decoder gain on the i9-10900K (paired against its merge base), with no CI regression under a memory rule calibrated before data (A/A control or PERFORMANCE-POLICY section 2)?
"""
why = """
CRC runs on every output byte in every decoder path; the dissection measured -7.3..-7.9% warm on whole real-wikidata A9. The first gate failed on an instrument-noise memory bound and on a machine that cannot see the mechanism, not on the advantage.
"""
stop_test = """
To be frozen by the taker before any new data (RULES C1a); do not reuse run 46054981092 as evidence for it.
"""
done_when = """

question = """
PR #1238's `front_avx2` redesign (64-symbol `u64` `vptest` Pass 1 + zero-dead-`per` `[u32; 256]` stack `cnt` freeing a GPR to hoist the step table + zero hot spills/calls/`vzeroupper`) is 100% exact, 7/7 SHA-256 identical, and Miri-clean (0 UB including direct AVX2+BMI1+BMI2+LZCNT+POPCNT interpretation). Attempt 1 (`d5e95794`, 256-bit `YMM_STEPS`, `23 insns / 105 B`) won Intel Xeon VM (`-3.9..-4.5%` `wikidata` 1t, `-7.2..-7.8%` `workers-lazy` 1t, `-6.4%` `text` 1t JCC) but went neutral on AMD EPYC 7763 Zen 3 (`wikidata` 1t `+0.4%`, 2t CPU `+0.7%` slower) because `vpermq $0x4e` inserted a 3-cycle cross-lane stall (`2 -> 5` cycles) on Zen 3's dual shuffle pipes. Attempt 2 (`791ee415`, zero-`vpermq` 2-cycle 128-bit VEX `(f0, f1)` XMM + hoisted `STEPS`, `25 insns / 118 B` in both baseline and JCC-32B with 0 alignment NOPs) eliminated all Zen regressions, held `-2.9..-5.0%` on Intel Xeon VM, and moved AMD EPYC 9V45 Zen 5 CI to `text` 1t `-2.2% (-4.6%, +0.2%)` and `text` 4t `-4.6% (-10.0%, +1.1%)`, missing `runs-front-and-fill-build`'s frozen CI gate only because `text` 1t's 95% CI crossed zero by `0.2%`, `runs::front` is `<10%` of Zen 5 `wikidata` 1t wall (`276 ms`), and `text` 2t RSS jitter (`+3.6%`) exceeded the frozen `<= 1.005x` point bound. Does `791ee415` (and optionally a paired comparison against `d5e95794`'s `YMM_STEPS` on Intel single-Port-5) deliver a paid whole-decoder speedup on the physical Comet Lake i9-10900K target machine under a noise-calibrated memory rule (PERFORMANCE-POLICY section 2), with CI used for no-regression + B5/Miri verification?
"""

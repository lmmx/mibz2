Can the three pure safe-Rust serial-scanner levers measured in `docs/journal/2026-11-26-explore/scanner-full-dissection.md`—orthogonally stacking with `huff-bmi2-dispatch` (#1004)—cut serial scan `S` (170-179 ms on i9-10900K, the 8-worker bottleneck once `mtf-fold-build` and `forward-emission` land) while keeping the shipped 24 KiB (`B = 10`, `K = 2`) L1d footprint and 100% exactness (symbols, bit positions, and libbzip2 error parity):
1. Uncapped consecutive same-selector run coalescing (`499,534` groups -> `188,898` runs on wikidata, -62.2% group tails and `k == 49` branches);
2. Byte-aligned 8-bit `SYM1`/`SYM2` LUT (`total_bits` in bits `0..7` with `live -= (e as u8) as u32` breaking LLVM's `and $0x3f` CSE off the shift chain, `SYM256` in `cnt == 0` slow path, `[u16; 18]` batch slices eliminating per-step bounds checks);
3. Eliminating `syms.resize(max_out, 0)` zero-fill after runt truncations (235/431 blocks = 40.23 MiB wasted memset in 8-worker LIFO pool);
4. Optionally combined with `huff-bmi2-dispatch` (`shlx`/`shrx`/`movbe`) if that probe passes?
"""

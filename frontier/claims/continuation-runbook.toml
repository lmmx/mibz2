needs_louis = ""
question = """
The maintainer explicitly rejects the previously proposed swarm-wide singleton watcher: NO coordinator agent, global watcher lease, dispatcher, permanent integration role, central polling owner, or dependence on one participant for progress. Implement deterministic continuation of individual dependency chains, not central scheduling. A normal swarm task can be a short runbook that waits for its own in-flight dependency and then proceeds, rather than yielding at every asynchronous boundary and relying on chance rediscovery.
Represent each outstanding continuation by its existing claim, action and exact dependency pin (CI/PR head, registered workstation recipe SHA, evidence bundle, release candidate or next required runbook gate). Reuse existing claims, reservations, review transfer, queue state and projections (#1341, #1241, workstation-pressure); add minimal structured waiting/resume metadata only where required. Each independent session follows its own chain, including multiple successive gates when authorised and eligible, using cheap task-local polling/wait primitives with bounded sleep and backoff (initial 30-60 seconds when in flight). Return control to the model only on meaningful state change, timeout, or genuine blocker. Do not make an agent repeatedly reason on unchanged state. The task can wait in place for a near-term dependency when useful; for long waits, hand back or park according to existing rules, preserving the exact resume predicate and next action so any eligible peer can pick it up. Do not tie up unrelated paths or workstation-queue ownership during passive waits. Never keep a reservation solely by falsely claiming active work.
Deduplicate active waits for the SAME logical continuation using existing scoped claim/lease ownership or a minimal per-continuation CAS token if necessary, never a global lease. Distinct chains can wait concurrently and progress independently, limited by existing budgets, real capabilities and useful work; avoid launching extra sessions just to poll. An abandoned or expired waiter must not strand its chain; normal peers can resume from shared state at their own checkpoints and safely acquire the ordinary action reservation. No designated watcher, no election of a leader, no agent assigning work to peers. A session with no current task may pick a waiting/ready runbook as ordinary work; it does not become responsible for the whole swarm.
Derive a read-only deterministic view of ready continuations in brief/status, using existing projections: actual critical dependency first, effective priority next, oldest ready first within that tier, stable claim/action/pin tie-break. This is a shared observation, not a dispatcher or mandatory global FIFO; independent peers choose eligible nonconflicting work and acquire it by existing CAS. Distinguish waiting, ready, held, failed, superseded, owner/capability-blocked and unknown. A returned bundle or green check never implies an adoption or publication PASS. Revalidate exact pins, gates, authority, independent-review restrictions and leases before actions. A task should carry its chain through readback, interpretation, required handoff and integration/publication where authorised, without waiting for a new owner prompt; other sessions remain free to investigate or advance independent chains.
Record deduplicated timing observations per claim/action/dependency pin: authoritative ready time or explicitly first observed time, acquisition, disposition and next dependency start. Report ready-to-acquire latency separately from execution time and explicit unknowns. Aim for pickup within 1-2 minutes for eligible critical continuations when a capable session is available; not a new scientific gate or guarantee when no session is active. Bound polling and telemetry cost, no master commits/PRs, shared epoch churn or CI event per poll. No new paid session, background service, credentials, spending or publication authority. Coordinate with current tooling leases and #1341; apply task-local waiting to existing release work now where safe, without waiting for the new tooling.
"""
why = """
Priority orders work when an agent looks, but does not ensure an asynchronous task resumes when its dependency finishes. The maintainer wants ordinary swarm tasks to continue through their own runbooks instead of opportunistic rediscovery at every boundary, while avoiding duplicate waiters on the same task. On 28 November the maintainer explicitly rejected the singleton watcher design as reintroducing the coordinator. Independent dependency chains must be able to make progress without any globally special participant. Measure handoff delays rather than assuming their cause.
"""
stop_test = """
Freeze fixtures before implementation: (1) two or more independent dependency chains wait and resume concurrently without a global watcher or leader; (2) competing peers on the same continuation do not duplicate active waiting or consequential execution, with ordinary ownership CAS and safe abandonment/expiry recovery; (3) exact-pin returned evidence or CI/review readiness wakes the relevant task, but stale/VOID/unread evidence never implies PASS, and changed heads or review independence are respected; (4) stable critical-path/priority/age ordering in read-only brief/status, capability/hold conflicts and unavailable remote state do not suppress other eligible work; (5) bounded task-local wait with fake clock, no repeated model calls on unchanged state in supported harnesses, graceful timeout/handback, no unnecessary retained path or queue locks, no per-poll PR/master/epoch churn; (6) one chain can advance multiple sequential gates under existing authority while others progress independently, no global bottleneck; (7) timing observations distinguish authoritative versus observed ready, acquire, completion and next start, survive restart and do not invent unknown times; (8) no extra session spend, dispatch duplication, unauthorised merge, approval or publish, no mandatory presence registration. Replay the v0.5.18 dependency chain and a separate benchmark or CI chain in parallel. Demonstrate real read-only state and task-local watch, report harness limitations and actual pickup latency separately from fixtures. No implementation may depend on a global watcher, even as optional default.
"""
done_when = """
Independently reviewed, exact-head-tested decentralised continuation runbook integrated with existing frontier tools and instructions. Demonstrate two independent chains can advance without a coordinator, ordinary scoped ownership prevents duplicate execution of the same continuation, and another eligible peer can resume a departed task. Measure real pickup if an eligible event occurs during verification; otherwise distinguish fixtures and live observations and leave the first-pickup measurement as a follow-up. Document manual task-local wait/resume fallback. Preserve existing release and review gates, continue v0.5.18 in parallel, and do not establish a global watcher, special agent role or dispatcher.
"""

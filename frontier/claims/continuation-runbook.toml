question = """
Implement the maintainer-approved continuation runbook: separate finishing an already-started dependency chain from opportunistically choosing new research. Extend the existing frontier projections (workstation-pressure, result-to-release, ship-completion-pressure #1341), rather than replace the swarm with a central dispatcher. Inventory in-flight exact-head PR CI/review, registered workstation runs and returned evidence, required readback/adoption/integration, and release runbook stages including recalibration, preflight, publication and reporting. Derive one deduplicated runnable continuation view from authoritative existing claims, leases, PR checks/reviews, exact ready pins, evidence and receipts; use small structured dependency metadata only when needed. Stable ordering: actual release/shared critical path first, effective priority next, oldest ready first within that tier, stable claim/action/pin tie-break. Distinguish genuinely ready, held, waiting, failed, superseded, capability-blocked, owner-blocked and unknown. A queued job, returned bundle, green check or stale review alone does not establish acceptance. Skip unavailable/conflicting work without starving other eligible continuations.
Provide a lightweight repository-native watch/poll command or equivalent in the existing runner/session tooling. At most one renewable singleton watcher lease across all harnesses, with atomic acquisition, expiry/takeover, fencing against stale holders and graceful departure. Use a bounded sleep/backoff and incremental read-only polling (aim 30-60 seconds when work is in flight, slower on failure/idle); do not consume inference on unchanged state or write a master commit/PR, shared epoch or CI event on every tick. A watcher is a duty any capable existing swarm session can acquire, not a permanent role, per-task agent, central allocator or additional paid session. Let a waiting capable session resume normal work on actionable transitions: it may acquire and execute short eligible continuations itself via ordinary claim/review transfer, including reading evidence and advancing the release runbook; otherwise expose the exact action and capability handoff to peers through brief/status. Do not reserve multiple tasks, seize a live hold, auto-approve/merge/publish from unverified inputs, invent a session-launch capability or require an owner to relay notifications. When the watcher is busy or absent, normal workers can still acquire continuations; allow safe takeover/fallback at frontier checkpoints. Keep independent research going while dependencies are in flight; do not block every worker on a single run or delay a release until this tooling lands.
Persist lightweight deduplicated timing observations keyed by claim/action/exact dependency pin: authoritative ready time if available (otherwise first observed ready with explicit uncertainty), acquisition time, disposition/completion time and next dependency start. Expose ready-to-acquire latency and overdue ready items separately from actual CI, workstation and review runtime; report missing watcher/capability and unknown timestamps explicitly. Aim for eligible critical-path pickups within 1-2 minutes while an authorised capable session is available; this is an operational target, not a new scientific acceptance gate or guaranteed wakeup when every harness is offline. Bound telemetry and polling cost; reuse existing refs/leases, runner state or durable deltas as appropriate. No new ongoing spend, third-party service, scheduled ChatGPT task, credentials, release authority or mandatory agent population registration.
Coordinate implementation paths with #1341 and current frontier tooling holds before acquiring; prefer a small independently reviewed patch and reuse existing state machine and tests. Make the runbook usable immediately by existing authorised sessions, including a documented manual bounded watch/resume fallback while automation is being implemented.
"""
why = """
The swarm currently reads brief at startup and after completing work. P1 and derived pressure determine which work an agent chooses, not when an agent notices that an asynchronous dependency has completed. This creates potentially unbounded gaps between benchmark arrival, evidence interpretation, review, integration and publication even with free reservation slots. The maintainer explicitly approves one shared continuation watcher and deterministic completion ordering after observing slow sequential progress on 28 November. Measure rather than assume how much delay comes from coordination versus actual execution. Preserve decentralised discovery and existing authority while making completion reliable.
"""
stop_test = """
Freeze fixtures before implementation: (1) release and adoption dependencies with exact matching returned evidence become runnable promptly, while stale/VOID/unread evidence never implies PASS; (2) pending CI/review becomes actionable on exact current head only, including changed head and independent-review restrictions; (3) deterministic critical-path/priority/age ordering with stable ties, simultaneous events and repeated polls without duplicate actions; (4) capability mismatch, live hold/conflict, cap, owner-only decision, failed gate, inaccessible remote data and unrelated runnable recipes expose specific reasons without suppressing other eligible actions; (5) concurrent watcher acquisition, renewal, expiry, takeover, stale-holder fencing, graceful exit and absence of a capable session; (6) watcher can execute an eligible continuation via existing CAS and review transfer but cannot bypass gates, reserve batches or duplicate a dispatch; (7) bounded sleep/backoff and read/write cost, no CI/master/epoch churn or duplicate polling per task, unchanged observations do not cause model calls in supported harnesses; (8) ready/acquired/completed/next-start timestamps distinguish authoritative versus observed time, survive restart, are deduplicated and show unknown rather than invented latency; (9) no interference with ordinary research or candidate stability, no automatic publishing/merging or additional spending in tests. Demonstrate a replay of the v0.5.18 asynchronous dependency chain and a benchmark-return or CI transition with fake clock, including ready-to-acquire latency. Test the real read-only projection and watch mode against current repo state; report observed latency and limits, not a promise of autonomous execution where no supported session exists.
"""
done_when = """
An independently reviewed, exact-head-tested repository-native continuation view and singleton watch/resume runbook is integrated, with one watcher at most, stable ordering, actionable ordinary acquisition commands, measured handoff latency and explicit no-watcher/capability blockers. Demonstrate a real eligible continuation being picked up and advanced without a maintainer prompt if one occurs during verification; otherwise report the fixture and live observation separately and leave an explicit follow-up to measure first real pickup. Document operation and recovery in existing frontier instructions; no new coordinator, fixed agent allocation or authority. Continue existing release-critical work in parallel; do not gate v0.5.18 on this implementation.
"""

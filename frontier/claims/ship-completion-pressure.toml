question = """
Implement docs/RELEASING.md §2a's persistent release completion pressure by extending the existing result-to-release projection (#1241) and release recognition, not creating a coordinator or second scheduler. Current failure: release_due() suppresses the release whenever a nonterminal release claim exists, while release_pipeline_state() marks an untagged existing release derived_p1=False and offers only its status, not its next unmet gate. The published board at 07ab2e7 says Release due: nothing even with accepted default software, a blocked v0.5.18 and an outstanding P1 preflight PR (#1256). A blocked release is not complete. The output must always distinguish no releasable work, release due without a claim, preparing/blocked on a named next gate, queued exact candidate, returned unread, gate failed, ready to publish, published awaiting required reporting, and complete; unknown data must remain unknown rather than silently suppress pressure.
Derive effective P1 and first actionable dependency from the existing release claim, relevant gate and evidence/PR state, including review, required recalibration, final CI, queue pins, verified result disposition, correction, publish and reporting. Use explicit minimal structured release dependency/pin metadata if necessary; do not infer success from prose, a tag alone, or a bundle's arrival. Respect actual capability, flag, ownership and admission constraints; show held or blocked next steps and the next eligible action. Surface review-transfer actions and the reason a blocked release can be resumed; use normal claim transitions and CAS, never force acquisition. Keep pressure while other recipes are runnable or PR discovery/evidence is unavailable; fail closed on consequential actions while retaining the visible unresolved release. Do not promote every research candidate to release-critical merely because it might improve the next version.
At candidate validation, expose a stable performance-input fingerprint, scope and invalidation conditions using the existing preflight machinery (#1256). At ordinary brief/status/merge checkpoints make unrelated candidate-invalidating work visibly deferred until publication while allowing independent branch work, required fixes, and metadata-only merges. Reuse existing queue order/standing authority to prioritise the next eligible release-critical recipe without interrupting a running job or adding ongoing spend. Do not make completion depend on presence counts, a specific agent, owner intervention, a new approval, or an optional experiment. Prefer a small tested patch; coordinate with #1303 and any live frontier tooling lease.
"""
why = """
P1 release recognition and #1241's pipeline did not prevent the overnight v0.5.18 stall: accepted software was on master, all 57 ready entries were already evidenced, preflight #1256 was still awaiting review since midnight, the release was marked blocked, and no recalibration/preflight run was queued. The new pre-publication regression gate must not turn into indefinite release starvation. The shared state should pull the shortest real completion path, and maintain a stable candidate, without the maintainer assigning work.
"""
stop_test = """
Freeze regression fixtures before implementation: (1) default merges plus an existing blocked/held release still expose persistent P1 (not 'nothing'); (2) #1256-like pending reviewed-gate dependency and §5c recalibration, with missing or held review, exact next eligible action and no duplicate claim; (3) unrelated runnable queue entry cannot clear release pressure; (4) matching current-pin evidence unread, invalid or failed, and successful readback advancing to next stage; (5) blocked release becomes resumable on dependency completion, using existing normal transitions; (6) pinned candidate plus independent branch work, safe metadata-only merge, unrelated performance-input-changing merge, required correction that invalidates evidence; (7) passed candidate ready to publish and post-tag reporting with pressure decaying only after disposition; (8) optional experimental work cannot delay a ready release; (9) no default work, missing data, stale tags/receipts, conflicts, cap, owner-only decisions, duplicate sessions and inaccessible workflow dispatch. Check effective priorities and actionable ordering in brief/status, including review entries; preserve existing release/adoption/lease gates, no unauthorised mutations, no duplicate dispatch or live publishing in tests. Report unknown explicitly. Reproduce the v0.5.18 failure from live shared state before or after the fixture.
"""
done_when = """
Independently reviewed exact-head implementation and regression tests; show the live release's next dependency and evidence without needing an owner prompt, and demonstrate progress/disposition through existing release-0-5-18 and pre-release-i9-gate claims. Do not leave the next release waiting for this tooling: apply the runbook directly now. No new scheduler, coordinator, approval, budget or fixed allocation.
"""

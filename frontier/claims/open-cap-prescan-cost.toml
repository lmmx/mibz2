question = """
The 0.5.17 release-scaling run (origin/evidence 5182d546, sha256 3b3af8b1...c8309b, i9-10900K, wikidata, 10 paired rounds) has 0.5.16/0.5.17 wall 0.974 [0.967, 0.982] at 8 threads and 0.985 [0.976, 0.995] at 10, with CPU 0.977/0.982 beyond noise (+8..+9 ms median CPU). #1222 is the only default-path change between the tags. Before it, every `lazy_counts_admit` block got `Cap::NONE` and skipped `within_cap`. After it, lazy-admitted blocks with 0.10 <= r/n < 0.15 (34 of Wikidata's 233) get `Cap::dense(n)` and pay a full scalar pre-scan of their records, which admits them all anyway. Is that pre-scan the loss, and can it be removed with every block's route unchanged (e.g. the cap checked inside the first pass, abandoned on overflow)? 2 threads shows the same +9.6 ms CPU, so code layout is the competing explanation: the diagnostic separates them before any build.
"""

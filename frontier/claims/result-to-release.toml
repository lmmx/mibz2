question = """
At the maintainer's direction, extend the existing frontier's derived workstation pressure and release recognition into a continuous, inspectable result-to-release path. Reuse claims, deltas, PRs, holds, queue pins, verified evidence receipts, ledger and release tags. A useful successful investigation must identify the smallest credible implementation or decision, with a linked successor claim (admit within the existing cap). An implemented candidate must identify the applicable acceptance route: ordinary CI/native paired acceptance where sufficient, or frozen target-machine diagnostic/adoption recipe where required. Show the next actionable dependency, not merely a promising result. Prepare, review, queue and confirm the exact pin under existing authority; when a bundle arrives, read, verify and dispose of it promptly even if the queue is already replenished. A diagnostic PASS is not adoption: expose the separately required adoption registration and implementation/promotion, rather than implying that an opt-in feature has shipped. An accepted default-path change must reach the existing P1 release recognition and runbook, including pre-release worker-count recalibration when the cost model requires it and post-release scaling/crossover/History. Do not make every change wait for an i9 run or for all experiments to finish.
Derive effective P1 pressure for the shortest eligible path from a returned unread relevant hardware result to a recorded verdict, from a verified promising result to its necessary implementation/validation/adoption successor when it is a shared release bottleneck, and from accepted untagged default changes to release. Keep existing replenishment pressure; readback and adoption pressure must not disappear merely because a different benchmark is runnable. Prioritise actual acceptance/closure over further discretionary probes. Show explicit blockers (review, lease, capability, owner decision, admission capacity, stale pin/evidence) and the next eligible work without preempting active holders. Distinguish planned, prepared, queued, returned-unread, diagnostic-pass, adoption-passed, merged-default and released; use compact plain language in brief/status, with evidence links and no parallel manual board. Prefer structured fields already present; add only the minimum explicit successor/receipt metadata needed if existing data cannot be joined reliably. Never infer a PASS from an archive, a title, a successful process exit or prose alone. Reuse the release ledger and existing exact-head/lease machinery, including the pending released-PR resumption fix (#1215); do not create a second scheduler or review system.
"""
why = """
Today's swarm generated credible combined gains (#1210) and multiple production candidates, yet returned evidence can sit behind parked claims and successful experimental merges can leave no visible route to default adoption. #1218 queued the adaptive scanner; evidence d6bc8ca is archived while the claim still reports blocked. #1168 is a diagnostic on an earlier four-lane implementation; #1217 improved it, so the next step must respect the registered pin and distinguish old diagnostic evidence from adoption of the current candidate. #1222 is a merged default-route change: inspect the existing release recognition and recalibration requirements now. The goal is shorter time from evidence to useful released code, not more experiments or blanket P1 inflation.
"""
stop_test = """
Freeze fixtures before implementing: (1) promising probe with/without a concrete successor and admission cap reached; (2) ordinary CI-accepted default change requiring no separate i9 adoption run; (3) reviewed recipe with missing queue row or pin; (4) queued current pin without evidence; (5) matching archived unread evidence while another recipe is runnable, including a parked claim; (6) diagnostic PASS needing adoption, distinct from adoption PASS ready to integrate; (7) STOP/KILL/VOID/INCOMPLETE and superseded pins, with scoped disposition or explicit distinct rescue, never automatic promotion or repeated timing; (8) accepted default merge awaiting tag, including cost-model recalibration, then tagged release awaiting scaling/recording; (9) experimental-only merge does not by itself imply a production performance release; (10) missing/stale/ambiguous evidence, failed checks, owner-only blocker, overlapping/live hold, absent capability, cap, and conflicting successors. Verify that brief/status show evidence-linked next actions with derived priority and decay on recorded disposition, preserve declared priority and existing admission/review/dispatch/CI/safety gates, deduplicate work across participants, and never grant authority from a receipt or self-declared result. Fail closed to unknown for unverified joins. No new automation service, new approval, mandatory per-stage PR, duplicate runs, weakened frozen threshold or new spend.
"""
done_when = """
Minimal independently reviewed implementation and regression tests under existing exact-head rules; demonstrate on the actual adaptive scanner, forward-emission and newest default merge (or their successors if the state has advanced), recording concrete next claims/PRs or their terminal dispositions. Document the route in the existing frontier loop, reconcile rather than duplicate earlier claims, and leave any needed owner decision in needs_louis. Success is actionable progress through existing mechanisms, not a dashboard alone.
"""

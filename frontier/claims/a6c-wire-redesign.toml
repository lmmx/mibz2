question = """
`a6c-wire-dissection` (`docs/journal/2026-11-27-explore/a6c-wire-dissection.md`) passed its frozen stop test across all 3 builds (baseline x86-64, native, JCC-32B-aligned native) and both cache regimes (warm & L3-cold) with 13,008/13,008 bit-identical checks, zero guard regressions, and `1.00x` worker scratch memory (0 B extra allocation on `OutQ16<512,512>`):
1. **Shipped bidirectional `Reader::wire_xor` (100% safe Rust, `#![forbid(unsafe_code)]`):** wrapping `&mut edges[..padded_len(m)]` with `std::cell::Cell::from_mut(...).as_slice_of_cells()` allows `dst_cells: &[Cell<u32>]` and `ep: &[Cell<u32>; 65536]` to coexist in safe Rust — eliminating BOTH per-element bounds checks (`edges[u]` and `edges[v]`), hoisting `mark_byte` (captured in Pass 1) and `mark_epoch` to eliminate `if v == mark` on 99.6% of rows, keeping the `OutQ16` chunk cursor in registers, and unrolling 4x in a single `OutQ16` pass (`B1b_cell_zerobc_4x`: `-26.91%` base warm, `-23.55%` base cold, `-20.19%` JCC-32B warm, `-17.53%` JCC-32B cold, all `DISJ_FASTER`, 95% CI upper `<= 0.8357`; with `Q1008`, `B6_cell_q1008_safe` reaches `-27.38%/-23.83%` base and `-24.38%/-20.15%` JCC-32B, plus `-12.18%..-13.51%` joint `A6a+A6c`).
2. **Post-`#1110` forward `Reader::wire` (100% safe Rust, optional runtime-dispatched AVX2):** keeping the chunk cursor in registers and replacing LLVM's `>= 32` / `% 32` / `% 8` / scalar-tail cascade (which fails on `78.95%` of Wikidata bands where `span < 32`) with a branch-minimized fixed-width `8/4/2/1` overlapping tail (`F2_reg_overlap_safe`: `-21.53%/-17.59%` base, `-19.99%/-12.72%` JCC-32B; on `Q1008`, `F5_reg_q1008_safe` reaches `-28.10%/-22.22%` base and `-23.74%/-15.59%` JCC-32B; optional runtime-dispatched AVX2 `16/8/4/2/1` `F3b`/`F6` pushes baseline x86-64 wheels to `-25.0%..-33.2%`).

Implement `B1b`/`B6` (`Cell`-based zero-bounds-check `wire_xor` + `mark_byte` hoisting) and `F2`/`F5` (register-cursor overlapping-tail `wire`, with optional B5-audited AVX2 dispatch for baseline wheels if justified) in `src/open/outq.rs` and `src/open.rs` once `mtf-fold-l1-batch-redesign` (`#1132`) finishes its edits to `src/open/outq.rs`.

question = """
An ordinary (non-integration) lease outlives its work when the holder forgets `release`: archive-team-strata (done, #977 merged) kept `docs/team/` reserved for ~8 hours and blocked migrate-rules. Should `reconcile_integrations` also release a lease whose claim on origin/master has status done/dropped and whose recorded `pr` is merged at a commit on master, recording `terminal` as finish-review does?
"""
why = """
Stranded reservations block the only eligible claim until expiry; there is no honest early release today.
"""
stop_test = """
Done when a test reproduces the stale-lease refusal and passes with the fix, releasing only on verified merged state and never on uncertainty.
"""
done_when = """
A PR with the reconciliation and its test, and a delta.
"""

2. Paired A/B performance (`examples/ab.rs --features forward-anchor-lanes` on Wikidata 1T/2T/4T + CI): statistically significant wall/CPU speedup on Wikidata under `--features forward-anchor-lanes` (expected >= 5% at 1T on `OpenCells` walk), zero regression on any guard corpus, and equal or lower peak RSS (`<= 1.00x` vs `#1110` `forward-anchor-lanes`).
"""

question = """
Read the verbatim research discussion at docs/journal/2026-11-24-algorithm-level/permutation-patterns/chatgpt-response.md and the directory README. Verify the relevant original representation theorems and hypotheses (Kozma–Opler, Brignall, Barbay–Navarro; separable permutations and small-pattern algorithms as appropriate). On real LF and Open retained maps, distinguish classical patterns from labelled first returns. Census strong intervals/irreducible cores, monotone subsequences, repeated local shapes and bounded short-pattern profiles, with the existing block-size/run covariates and a preregistered split by distinct block identity. Select at most two pattern-derived representation families using training blocks. Produce exact prebuilt representations and time their real labelled consumers against matched prebuilt shipped and forward controls; report navigation, label storage, output writes, working set and coordinate cost. Reuse the ideal-permutation-structures harness and controls when present; otherwise deliver interoperable artifacts under this research directory or uniquely named examples, not a second general ideal-structures harness. No production edits.
"""
why = """
Raw LF avoids a descending pattern of length sigma+1 by stable byte order, but first returns need not inherit that property (binary bbaaa example in the discussion). Existing cycle and displacement censuses do not establish irreducibility or pattern avoidance. Pattern-based succinct permutation representations support efficient forward and inverse queries under stated hypotheses, but those are not automatically efficient orbit consumers. This is a dedicated application branch of ideal-permutation-structures, with the construction/discovery cost separated from downstream value. A successful representation supplies a concrete constructor target rather than another unpriced abstract mathematical proposal.
"""
stop_test = """
Freeze candidate families, bounded local compute budget, distinct-block train/held-out split and repeat design before data. Use exact recognition or proof for any assumed avoidance; sampled absence is not proof. Preserve byte-identical bwt::walk outputs, marked rotation and periodic/multicycle semantics; include arbitrary-column controls. Charge every consumer lookup, conversion, metadata, spelling and store; match warm/cold conditions, report prebuilt consumer gain and materialisation separately. Apply the parent diagnostic's 39.18 ms (3% of 1,306 ms at one worker) combined budget, with labelled measured or explicitly projected values and an actual downstream gain over the matched prebuilt baseline/forward control (or a separately demonstrated cheaper materialisation). Report allowable constructor cost C0+E0-E1-39.18 ms and scan-ideal eight-worker results only if measured. Admit a separate constructor claim only for a concrete candidate that passes; otherwise record the scoped family verdict, not a universal no-go. No new workstation spending or changes to frozen earlier verdicts.
"""

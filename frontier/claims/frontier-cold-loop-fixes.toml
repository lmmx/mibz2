question = """
`docs/notebook/2026-11-28-prove-frontier-cold.md` followed the frontier loop cold on a private bare remote and found 16 concrete defects (5 `breaks`, 6 `misleads`, 5 `friction`):
- **`frontier.py` CLI & validation (`B2, B3, B5, M1, M2, M4, M5, F1, F3, F4`):** migrate `main()` from hand-rolled `opt` lambda / `argv[2]` indexing (8 raw `IndexError`/`ValueError` crashes, silent ignoring of unknown flags/typos, `--help` exiting `2`, missing `--by`/`--as` defaulting to `"unknown"`, missing `--session` printing `session None`) to stdlib `argparse`; bound `--hours` (`0 < hours <= 24`); add `--pr N` support to `mark --status review` (and align `--help`/`README.md:41`); distinguish released vs lapsed holds in `mine()`; make double `release` an idempotent no-op without pushing a duplicate commit.
- **`frontier.py check` flag resolution (`B4`):** fix `frontier.py:2307–2312`, which checks `resolved_by != by` (flag filer) rather than != the flagged work's author, inverting `frontier/flags/README.md:18`.
- **`continuation.py` & `CONTINUATIONS.md` (`B1, B2, M3, F5`):** add `--manual` to `resume` so `manual:<text>` pins can actually be resumed by hand instead of failing `EXIT=15` forever; bound `resume --hours` (`0 < hours <= 8`); include `--session <session>` in `_next_step`'s printed `done` command; print ISO timestamps in `show` and document `--next` in `CONTINUATIONS.md:48`.
- **Docs (`M6, F2`):** note `.github/coordination/coord.py head-sha`, `GITHUB_TOKEN`, and `gh pr merge --match-head-commit` alongside `expectedHeadSha` in `frontier/README.md` (and separately `CLAUDE.md` only if owner-approved under RULES D / or via a narrow doc note), and note `long-context` for `explore`/`synthesise` in `README.md:22`.

Queued behind `#1341` (`ship-completion-pressure`) and `brief-state-first` on `frontier/tools/frontier.py`: do all 16 cold-walkthrough fixes pass hermetic pytest coverage (`tests/test_frontier.py`, `tests/test_continuation.py`) and a clean repeat cold run on a private bare remote?
"""
why = """
Every new harness or fresh session hits these defects immediately: silent typo acceptance on `claim`, 417-day unbounded lease TTLs, raw Python tracebacks on missing arguments, permanently stuck `manual:` continuations, copy-paste-broken `continuation.py done` instructions, and an inverted flag-resolution check that blocks flaggers while allowing self-dismissal. Fixing them mechanically hardens the swarm's shared coordination layer with zero new dependencies. Note: the `continuation.py` / `CONTINUATIONS.md` items (`B1`, `B2` resume `--hours`, `M3`, `F5` `show`/`--next`) are already landed separately on `ops/continuation-hardening`, leaving the `frontier/tools/frontier.py` and `README.md` items once `#1341` and `brief-state-first` finish.
"""

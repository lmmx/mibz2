question = """
Today the protected list and the merge gates are kept by convention. GitHub branch protection could make them binding:
- required checks (no AI attribution, check-commit, the frontier check);
- a CODEOWNERS review for the protected paths;
- no direct pushes to master.
Implement the already approved scope recorded in frontier/deltas/2026-11-26-owner-decisions.md, without a new owner decision. The frontier check becomes required only after its known failures are fixed and independently verified. No mandatory independent-account or CODEOWNERS approval while agents share the owner's identity. This is a P1 capacity-unblocking dependency; coordinate through committed evidence and the existing review, not session routing.
"""

question = """
`prove-frontier-damaged` (`docs/notebook/2026-11-28-prove-frontier-damaged.md`) tested 144 single hand-editing damages on private bare remotes and found **19 distinct defects** (**10 `breaks`**, **7 `misleads`**, **2 `friction`**; **40/144** raw Python tracebacks). Every non-`swarm-quiet-state` fix was verified on scratch copies (`0/144` tracebacks, `90/90` `tests/test_frontier.py`, `34/34` `tests/test_continuation.py`, `0 errors` on live `mibz2`):

1. **Hold & lease safety (`frontier.py`):**
   - Replace `write_lease()`'s `repr(v).replace("'", '"')` with `_toml_value()` using `json.dumps()` so `--by 'bot"quote'` / `--by "o'reilly"` never self-brick `hold/*` globally.
   - Isolate per-ref missing/malformed/non-UTF-8/naive-`expires`/non-bool-`released`/nested-slash `hold/*` refs in `holds()` (marked `_malformed`, counted live fail-closed, never crashing unrelated commands and never silently dropping locks), with trunk claim scope fallback in `conflicts()` so damaged holds still block overlapping striated claims.
   - Guard missing `holder`/`pr`/`pr_head`/`expires` in `claim`/`verify`/`mine`, and fail `verify` when a held claim was renamed or deleted on `origin/master`.
2. **Validator & loader resilience (`frontier.py`):**
   - Add `load_checked()`, `heads_checked()`, `_read_tsv_checked()`, and `<!-- brief -->` checks so bad TOML/UTF-8, broken symlinks, empty TSVs, missing `id`, blog `stage` typos, and non-string `stop_test` emit named `error:` lines instead of crashing `check`/`brief`/`status`.
   - Enforce claim field types/ranges (`priority` exact `int` in `1..5`, `needs`/`owned_paths`/`mechanisms`/`premises` `list[str]`, non-empty `title`/`question`/`stop_test`, `needs_louis` `str`, positive `int` `pr` at `review`, valid ref-safe `id`).
   - Close flag immune-system bypasses: reject duplicate header keys in deltas/flags, reject comma-separated `flags:`, reject blank required headers, freeze `flags:` scope and `invariant:` on modified flags, and validate `outcome` enum on newly added deltas (preserving legacy historical deltas).
   - Validate `config.toml` (`max_open_claims`, `protected`, and rejecting omitted `limits_file` when `limits.toml` exists), and print step 1–4 errors before returning on step-5 config failure.
3. **`mark` & CLI (`frontier.py`):**
   - Support single/double quotes and inline comments in `mark` and require `re.subn(...)[1] == 1` (never exit `0` unchanged).
   - Clean usage errors for missing CLI args, dangling options, and non-numeric/`NaN`/`Inf` `--hours` (and migrate `test_s2`/`test_s3` off `--hours -0.01` so `claim` can also reject `hours <= 0`).
4. **Continuation isolation (`continuation.py`):**
   - Isolate broken/missing/non-UTF-8 `refs/heads/wait/*` refs in `GitRefStore.list()` as `[malformed]` (keeping `show`/`get` strict `ContinuationError` `rc=2`) and guard non-int `priority`/`since` in `view()`.

**Sequencing & coordination:** Build strictly after PR `#1341` (`ship-completion-pressure`) releases `frontier/tools/frontier.py`. Defect #10 (`limits.toml` fail-closed state in `brief`/`renew` + `max_live_holds = 0` drain) overlaps `swarm-quiet-state` and stays in `swarm-quiet-state` rather than duplicating its safety-gate change here.
"""

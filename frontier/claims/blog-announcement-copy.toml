question = """
Give the maintainer one-tap clipboard access to the exact social announcement for any published post, directly on the existing blog index. The newest post is already at the top: add a discreet icon-only loudhailer/megaphone button beside each post card (not nested inside its anchor), using a monochrome site-matching icon with no visible Copy announcement label. Keep the accessible name and tooltip 'Copy announcement', a comfortable touch target, and brief Copied feedback. Also provide the same action on individual article pages if this can be generated through the existing common template without editing every article. Derive titles and canonical URLs from existing page/index metadata automatically; copy only the plain-text announcement, not a URL alone or rendered HTML. Make it convenient on mobile and desktop; provide a selectable single-post text fallback if clipboard access fails. No separate list or raw text file as the primary interface, no manual selecting lines, no extra navigation to copy the latest post. Reuse the normal build and publication pipeline; no extra publication PRs, manual metadata duplication, scheduled notifications or social posting.
Exact clipboard text for the example:
📣 mibz2 blog ⠶ The decoder's true floor and the limits of a pooled scan https://lmmx.github.io/mibz2/blog/2026-11-26-true-floor-and-pooled-scan/
"""
why = """
P1 at the maintainer's explicit direction: expedite admission and the smallest complete implementation in parallel with other P1 work, without preempting existing reservations or bypassing normal checks. The maintainer manually announces mibz2 blog posts on socials with a fixed title-and-link format and wants the copy produced in the repository/site, not by a chat notification. The existing blog index is already maintained with each publication; deriving copy during the build removes repeated work without a new agent role or publication gate.
"""
stop_test = """
Freeze tests before implementation: exact sample clipboard line (including the 📣 emoji, Braille separator, punctuation and canonical trailing slash), correct title and canonical URL for each published article including technical companions, no draft/index entries or duplicate controls, correct HTML escaping/entity decoding and UTF-8, and automatic inclusion of a newly indexed post. Verify clicking the control copies the complete single line without navigating, gives success feedback only after a successful clipboard write, and exposes an accessible selectable fallback when clipboard access fails. Verify the icon-only loudhailer control has an accessible name, responsive touch targets, keyboard access, dark/light appearance, and no regression to existing card navigation. Keep the site design discreet; no new page required for the primary action. Verify strict site build and render checks. No external social actions, new spending, scheduled notifications, redirects or additional publication approval.
"""
done_when = """
The existing blog index exposes a working one-tap icon-only loudhailer copy action for every published post, including future posts without special author work. Individual post access if readily supported by the common template. Test actual clipboard behaviour or a faithful browser test and the fallback, integrate under existing repository rules, and record the live location and any deployment uncertainty.
"""

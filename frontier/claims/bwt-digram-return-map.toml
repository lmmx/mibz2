Consumer-side potential is +278..+365 ms of the 1,306 ms 1-worker wall over single-lane forward emission (+163..+237 ms even over 4-lane forward) and ~43-52 ms/worker under scan-ideal 8w, attacking `E-walk` and `E-spelling`'s 81.2% literal storm jointly while shrinking total representation bytes below Open's 518 KiB/blk.
"""

question = """
Run the frozen kill test for the `mtf-fold` prototype (mtf-fold-build) on the i9-10900K: does folding MTF/RLE2 into construction's first pass save >= 2.5% wall at 1 worker (K1) and >= 2.5% behind ideal S at 8 workers (K2), without regressing the shipped wall at 6 or 8 (K3) or RSS (K4)?
Not yet runnable from master, which lacks two things the registration's binary needs:
1. The zero-copy scan oracle (`scan-oracle`, `src/scan_oracle.rs`, `origin/bench/zero-copy-floor`, code commit 1e27e46f972f). It must be ported beside `mtf-fold`. In its Replay mode `b.syms` is empty and workers borrow the symbols through `scan_oracle::with_syms`, so `runs::fold::wants` (which gates on `b.syms.len() >= MIN_SYMS`) and both fold fronts must read the borrowed slice, or the FS arm silently never folds (VOID under §3.5). Assert `fold::take_counts().folded > 0` in FS.
2. A frozen recipe (`bench-mtf-fold`, `just submit` shape per CLAUDE.md): arms none, F, S, FS at k = 1, 6, 8, 9, 10 and SM, SC at 8; scanner pinned; 12 randomised blocks with traces in the first 3; trace A5, A6 (fused in F/FS: `InvertStart` .. `InvertEnd` now spans the fold), A9, copy_out and ready_bytes hwm; peak RSS; `fold::take_counts()` per arm (VOID if any Open-admitted block is `bailed`); plus `ab gen` text at k = 1, 8 for the fallback cost.
Then review, green, ready tag and queue entry (standing authorisation), and read the bundle against registration §3.3.
"""
why = """
mtf-fold-build's prototype is exact (bytes and errors, Miri on the scalar fold) but untimed. The census predicts ~40-85 ms at 1w and ~6-13 ms/w at 8w behind S ideal; only the i9 run decides it.
"""
stop_test = """
Frozen at docs/journal/2026-11-24-algorithm-level/mtf-fold/registration.md §3 (K1-K4, VOID §3.5). C2 applies: nothing is relaxed after data. The S-ideal oracle's cold syms store (#952: ~50 MiB of u16 symbols, beyond the 20 MiB L3) is read by both S and FS, so it dilutes K2 toward 1 (against the fold, never for it); report FS/S's syms-store DRAM reads beside it, and do not adjust K2.
"""

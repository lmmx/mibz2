question = """
The pooled scan was killed as built because pooling loads the scan's ~175 ms of CPU onto workers that bind below the knee (pooled-scan/results). Design a hybrid: the serial scanner stays, and workers scan ahead only when they would otherwise wait. Write the design and its kill test as a registration. No code until the worker-side claims land, since its value depends on worker slack.
Note (synthesis third-pass §2, derived from c71c4a56): the built pooled scan conserves work, P(k) = S(k) + scan/k to within 1.5% at k = 6-9 (PC = SC + scan/k likewise). So the hybrid's ceiling is the work bound (k S + scan)/(k + 1): 184.1 ms at 8 today (4.6% under none), about 155-163 ms if the fold and forward emission bring S(8) to 152-161 ms. Register when an S-paired worker run puts S(8) at or under about 165 ms, where the ceiling is about 10% under none (none(8) taken as max(scan, S) + 8 ms, the coupling measured at 8).
Note (synthesis fourth-pass §2): after #986 stopped B=10 K=3/K=4 multi-symbol tables, `pooled-scan-hybrid` (plus the newly opened `huff-bmi2-dispatch` ISA probe) are the only remaining scan levers. Even under #982's conservative mtf-fold floor (3-6 ms/w), #992/#998's prebuilt 4-lane forward emission alone projects S(8) ~ 148-156 ms (crossing the 158-165 ms trigger independently), and fold + 4-lane forward puts S(8) ~ 135-153 ms with a hybrid ceiling of 140-156 ms (138-155 ms with BMI2), reaching #984's 6 GB/s (~140 ms) milestone.
Note (synthesis seventh-pass §4, 27 Nov): with #1046 (`a6b-combined-redesign`, +8.2..+9.1 ms/w) and open PR #1045 (`forward-rle1-crc-fusion`, ~+4.0..+6.7 ms/w) composing with prebuilt 4-lane forward, derived worker time drops to W'/8 ~ 132.6-143.9 ms even without mtf-fold (after #1048 found #1010 regresses from spills), or ~119.6-137.9 ms with `mtf-fold-l1-batch-redesign` — below #1031+#1034's projected serial scanner S' ~ 143-150 ms. That puts the hybrid work bound (8*W'/8 + S')/9 at ~133.8-144.5 ms (no fold) / ~122.2-139.1 ms (with fold redesign), making slack-only hybrid scanning the clean unlock to ~140 ms (6 GB/s) once measured i9 runs confirm paid 4-lane anchors and DECODER.md's S'(8) <= 165 ms trigger.
Note (explore slack-hybrid-scan-feasibility, 27 Nov, derived from primary i9 traces): exact discrete-event replay of `src/parallel.rs` shows slack-only hybrid reaches `(8*W'/8 + S')/9 + 4.85 ms` (`+3.50 ms` with small chunk 0), breaking `140.0 ms` (6 GB/s) at `W'/8 <= 133.9 ms` (`<= 135.4 ms` small chunk 0) for `S' = 145 ms` (`131.8 ms` / `+8.2 ms` margin at `145/125`), while avoiding #942's `k = 6` regression (`0.997-0.999x` across `k = 6..7`). Design requirements for `hybrid-registration.md`: (1) run AVX2 `Finder` (`4.82 ms` K4) on the 91.6%-idle `mibz2-read` feeder with async `OnceLock` on chunk 0 (`0 ms` scanner/startup tax); (2) zero-copy `Arc<Chunk>` slicing leaving the ~11 seam-straddling blocks to #1031's seam window (`pool_copy` `5.27 -> 0 ms`); (3) `full_only` candidate filter (`gap >= 512 B`, cuts helper handoffs -35..-41%); (4) Policy A jump-ahead scanner with async chain verification (never #770's `serial_wait`); (5) `max_lookahead = 8..16` and worker-local `ScanScratch` + `Vec<u16>` running #1034's `read_item_with_scratch` end-to-end on one core.
Note (synthesis ninth pass, 27 Nov, derived): slack-only hybrid helps only when the scanner binds, by S' - W'/8 > ~5.5 ms (from (8W+S)/9 + 4.85 < S). With #1069 (S' ~134-139 ms) and #1067 (W'/8 ~135-145 ms) the k = 8 knee is a tie or worker-bound, so the hybrid's k = 8 gain is about zero; its value moves to k = 9-10, where S' - 8/9 W' ~5-15 ms. Register for k = 9-10, not k = 8.
"""
why = """
The scan is still 179 ms of the 195 ms wall at 8 workers when the workers are free.
Synthesis tenth pass: the slack-only condition S' - W'/8 > ~5.5 ms holds at k = 8 on text (gap ~0.15-0.43 S', #1075) and on JCC-aligned wikidata (~6-22 ms, derived from #1076/#1077), failing only for unaligned wikidata. Register with the corpus and codegen it is priced on.
"""
stop_test = """
Design only: a registration frozen before any data.
"""
done_when = """
pooled-scan/hybrid-registration.md and a delta.
"""

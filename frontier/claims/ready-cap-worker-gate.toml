id = "ready-cap-worker-gate"
title = "Bound run-only (high-expansion) blocks' memory by the ready cap, not the window"
kind = "build"
zone = "striated"
needs = ["shell", "rust"]
priority = 2
status = "done"
owned_paths = ["src/parallel.rs"]
mechanisms = ["worker-side-ready-cap"]
needs_louis = ""
question = """
`READY_BYTES` gates only the scanner's issue (`Shared::full`), so on run-only blocks (~46 MB decoded each) the scanner fills the whole window before any block is ready and the workers decode all of it: peak RSS is ~46 MB x slots (943 MiB at t=4/32 slots, 1.27 GB for a 1,522-byte input at the library default for 8 threads), and the 16-32 slot windows run 24-28% slower than 8 from first-touch faults (docs/journal/2026-11-27-explore/expansive-block-memory.md). Does making a worker wait before starting a block at place >= taken + floor while ready bytes >= cap (and capping the `free_out` pool in bytes, e.g. at the cap plus the in-flight floor) bound that memory to ~(threads + 2 + 2) blocks without touching wikidata?
"""
why = """
A memory-amplification and robustness property of the shipped decoder (a tiny input forces GB of RSS in every BzReader::parallel / Python caller), invisible on the bench corpus, with a time cost on run-heavy streams. The change is local to the cap logic.
Synthesis eleventh pass (27 Nov): P3 -> P2; left at idea because open claims are at max_open_claims (admit when a slot frees). It is a precondition of two lines: `runt-exempt-window` (whose symbol-bound runt test exempts exactly these 46 MB blocks, doubling the worst case) and any k = 9-10 / default-count adoption (worst case ~ (4k + 2) x 46 MB). No CI corpus holds two expansive blocks, so no existing gate sees it. Shares src/parallel.rs with `scanner-seam-window`; take it when that hold clears. docs/journal/2026-11-27-synthesis/eleventh-pass.md.
"""
stop_test = """
Frozen before data:
1. Byte- and error-identical output on `cargo test`, `fuzz-smoke` and the three corpora of the note; no deadlock under the existing panic/cancel tests.
2. On zeros.bz2 (2 GiB of zeros, bzip2 -9) peak RSS at t=4 with 16 and 32 slots <= 1.15x the t=4/8-slot figure measured on the same machine in the same session, and wall no slower than the shipped build's at the same settings.
3. On text-like input (the note's text corpus, and wikidata x1 if available) 1-, 4-worker wall no slower than 1.005x shipped (7 interleaved repeats, 95% CI). If (2) needs a gate that costs (3), STOP and record a scoped dead-end.
"""
done_when = """
A PR on src/parallel.rs passing (1)-(3), with a delta; or a scoped dead-end row.
"""

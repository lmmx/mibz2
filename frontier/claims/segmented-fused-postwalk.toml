1. Exactness & B5 safety: 100% byte-identical, CRC-identical, and error-identical (including `RunUnfinished`, short blocks `< MIN_SEGMENTED`, short cycles `m < n`, RLE1 runs straddling segment/4 KiB boundaries, and expansive `onebyte`) across `cargo test`, Miri (scalar path + all unsafe invariants justified under B5), `fuzz-smoke`, and all 7 corpora; zero Wikidata route changes (233 Open).
2. Paired A/B performance (`examples/ab.rs` + CI paired bench) under `PERFORMANCE-POLICY.md` §2: statistically significant primary wall-time speedup on `text` (95% CI wholly below 1.000, expected >= 6% at 1T), zero primary regression on `wikidata` or `text` at any thread count, zero secondary regression > 2% on `pattern` / `random` / `records` / `runs` / `onebyte`, and peak RSS ratio <= 1.02x. If `text` fails to show a primary win or any primary/guard regression breaches policy, STOP and record a scoped row in `frontier/dead-ends.tsv`.
"""

# The frontier's shared settings. Nothing here depends on GitHub Actions.

# The issues the optional Action mirrors STATUS.md and the Needs Louis list to.
status_issue = 943
needs_louis_issue = 944

# Operational reservation ceiling now lives in limits.toml. The zero here is a
# one-time compatibility interlock: epoch-aware legacy clients cannot start new
# work until refreshed, but can finish and release existing reservations.
limits_file = "limits.toml"
max_live_holds = 0
max_open_claims = 12

# Conservation of authority: changes to these paths are never self-merged; a different agent
# reviews and merges them, and a change to what RULES D reserves needs Louis.
protected = [
  ".github/",
  "AGENTS.md",
  "CLAUDE.md",
  "GEMINI.md",
  "bench/workstation-queue.txt",
  "docs/RELEASING.md",
  "docs/team/RULES.md",
  "frontier/README.md",
  "frontier/config.toml",
  "frontier/tools/",
]

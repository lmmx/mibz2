# The frontier's shared settings. Nothing here depends on GitHub Actions.

# The issues the optional Action mirrors STATUS.md and the Needs Louis list to.
status_issue = 943
needs_louis_issue = 944

# Bounded expenditure, canary first (Gemini and ChatGPT, 26 November): at most this many live holds at once (frontier.py claim refuses beyond
# it), and at most this many open claims (more stay at status "idea" until admitted). The canary
# cap of 3 held until the stress-test flags were resolved (#955, #974, #987); raised to 6 on
# 26 November at Louis's request. Next step, 10, after saturation evidence at 6 (#991).
max_live_holds = 6
max_open_claims = 12

# Conservation of authority: these paths flag changes needing an authority/risk check.
# The path alone does not require a second agent; substantive gates and RULES D still apply.
protected = [
  ".github/",
  "AGENTS.md",
  "CLAUDE.md",
  "GEMINI.md",
  "bench/workstation-queue.txt",
  "docs/RELEASING.md",
  "docs/team/RULES.md",
  "frontier/README.md",
  "frontier/config.toml",
  "frontier/tools/",
]
